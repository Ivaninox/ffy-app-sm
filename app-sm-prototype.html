/* ================= v8 : Agenda jour par jour ================= */
S.day=0;
const H=46,H0=7,H1=21;
R.missions=()=>{
  if(S.filter==='past')return pastView();
  const f=S.filter==='mine'||S.filter==='dispo'?S.filter:'all';
  const counts=d=>({m:Object.values(M).filter(m=>m.day===d&&isMine(m)&&m.st!=='refusee').length,o:Object.values(M).filter(m=>m.day===d&&visibleOffer(m)).length});
  const wk=[-1,0,1,2,3,4,5].map(d=>{const i=dayInfo(d),c=counts(d);return `<button class="wd ${d===S.day?'on':''} ${d<0?'past':''}" data-act="pickDay" data-d="${d}"><small>${i.s}</small><b>${i.n}</b><span class="cnt">${c.m?`<i class="m">${c.m}</i>`:''}${c.o?`<i class="o">${c.o}</i>`:''}</span></button>`;}).join('');
  const d=S.day,c=counts(d);
  let items=Object.values(M).filter(m=>m.day===d&&((isMine(m)&&m.st!=='refusee'&&f!=='dispo')||(visibleOffer(m)&&f!=='mine')));
  items.sort((a,b)=>toMin(a.h1)-toMin(b.h1));
  // colonnes en cas de chevauchement
  const cols=[];items.forEach(m=>{let k=0;while(cols[k]&&cols[k].some(o=>overlap(o,m)))k++;(cols[k]=cols[k]||[]).push(m);m._col=k;});
  items.forEach(m=>{m._n=Math.max(1,...items.filter(o=>overlap(o,m)||o===m).map(o=>o._col+1));});
  const hours=Array.from({length:H1-H0+1},(_,k)=>`<div class="hr" style="top:${k*H}px"><span>${String(H0+k).padStart(2,'0')}h</span></div>`).join('');
  const blocks=items.map(m=>{const top=(toMin(m.h1)-H0*60)/60*H,h=(toMin(m.h2)-toMin(m.h1))/60*H-4;const w=100/m._n;const off=isOffer(m);const run=S.T&&S.T.id===m.id&&S.T.phase==='run';
    return `<button class="blk ${off?'off':'mine'} ${h<80?'short':''} ${m._n>1?'narrow':''}" style="top:${top+2}px;height:${h}px;left:calc(${m._col*w}% + ${m._col?3:0}px);width:calc(${w}% - ${m._n>1?3:0}px);--c:${SVC[m.svc].c}" ${run?'data-act="toTerrain"':`data-go="detail" data-id="${m.id}"`}>
      <span class="b-top">${off?`<span class="tag-offer">${ic('plus','xs')}${m.backup?'Backup':'Offre'}</span>`:svcChip(m.svc)}<span class="b-h">${m.h1.replace(':','h')} – ${m.h2.replace(':','h')}</span></span>
      <b>${m.title}</b>
      <span class="b-m">${off?`${pay(m)} € · ${m.places} place${m.places>1?'s':''}`:(run?pill('En cours','--ffy-success',1):stPill(m,1))}</span></button>`;}).join('');
  const now=d===0?`<div class="now" style="top:${(13*60+48-H0*60)/60*H}px"><i></i></div>`:'';
  const di=dayInfo(d);
  return {tabs:true,html:`<div class="agwrap"><div class="agtop">${missionsHead('agenda').replace('<div class="ibtns">','<div class="ibtns"><button class="ib" data-act="mFilter" data-f="past" aria-label="Historique">'+ic('clock')+'</button>')}
    <div class="wk8r">${wk}</div>
    <div class="seg f8">${[['all','Tout'],['mine','Mes missions'],['dispo','Offres']].map(([k,l])=>`<button class="${f===k?'on':''}" data-act="mFilter" data-f="${k}">${l}</button>`).join('')}</div>
    <div class="dayhead"><b>${dayLabel(d)}${d===0||d===1?` <small>${di.s} ${di.n}</small>`:''}</b><span class="legend8"><span><i class="m"></i>${c.m} mission${c.m>1?'s':''}</span><span><i class="o"></i>${c.o} offre${c.o>1?'s':''}</span></span></div></div>
    <div class="agscroll" id="agendaScroll"><div class="tgrid" style="height:${(H1-H0)*H+8}px">${hours}${now}<div class="lane">${blocks}</div>
      ${items.length?'':`<div class="tg-empty"><b>Rien de prévu ce jour-là</b><span>Aucune mission ni offre compatible avec ton planning.</span><button class="btn s sm" data-act="mView" data-v="camps">Voir toutes les offres</button></div>`}</div></div></div>`,
    after:()=>{const sc=$('#agendaScroll');const first=items[0];if(sc)sc.scrollTop=first?(toMin(first.h1)-H0*60)/60*H-24:60;}};
};
function pastView(){
  const past=Object.values(M).filter(m=>isMine(m)&&(m.day<0||m.st==='refusee'||m.st==='terminee')).sort((a,b)=>b.day-a.day);
  return {tabs:true,html:`<div class="scroll"><div class="hdr"><button class="ib" data-act="mFilter" data-f="all" aria-label="Retour à l’agenda">${ic('back')}</button><div class="ttl"><b style="font-size:20px">Historique</b><span>Missions passées et candidatures non retenues</span></div></div>
    <div class="groupcard g8">${past.map(m=>{const i=dayInfo(m.day);return `<button class="wk8" data-go="detail" data-id="${m.id}"><span class="d">${i.s} <b>${i.n}</b></span><span class="bar" style="background:${SVC[m.svc].c}"></span><span class="t">${m.title}</span>${stPill(m,1)}</button>`;}).join('')}</div></div>`};
}

/* ================= v8 : Campagnes ================= */
S.cf='all';S.sel=new Set();
const campSlots=ck=>Object.values(M).filter(m=>m.camp===ck&&m.day>=0&&visibleOffer(m)).sort((a,b)=>a.day-b.day||toMin(a.h1)-toMin(b.h1));
const svcTile=s=>`<span class="svt" style="--c:${SVC[s].c}">${ic(s==='hand'?'user':s==='store'?'shop':'box','sm')}</span>`;
R.camps=()=>{
  const all=Object.keys(CAMPS).map(ck=>[ck,campSlots(ck)]).filter(([ck,l])=>l.length);

  function build(){

      const wu=Math.hypot(c[1][0]-c[0][0],c[1][1]-c[0][1]),wv=Math.hypot(c[3][0]-c[0][0],c[3][1]-c[0][1]);

      const B=(u,w)=>{const top=lerp(c[0],c[1],u),bot=lerp(c[3],c[2],u);return lerp(top,bot,w);};

        continue;

S.ia={ctx:undefined,msgs:[]};
const norm=t=>t.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'');
function iaAnswer(q,ctx){
  const t=norm(q),m=ctx?M[ctx]:null,c=m?CAMPS[m.camp].name:'';
  const R_=(txt,src,acts=[])=>({t:txt,src,acts});
  if(/paye|paie|paiement|virement|facture|argent|salaire/.test(t))return R_('Tu es payé·e chaque fin de mois par virement, sur ton IBAN FR76 •••• 0189. Ta facture de septembre (386,40 €) est prête : valide-la avant <b>jeudi 8 oct. à 18h</b>. Sans réponse, elle est validée automatiquement, puis payée à 30 jours.',['Tes factures','FAQ FFY · Paiement'],[['Voir ma facture','data-go="invoice" data-id="sep"']]);
  if(m&&/gagn|combien|remuner|tarif/.test(t))return R_(`Pour ${c} · ${m.zone} : ${m.hours} h × ${m.rate} € = <b>${pay(m)} €</b>${m.bonus?`, plus ${m.bonus} € de bonus si tu es appelé·e en backup`:''}. Le montant final dépend du temps retenu (les pauses sont déduites) et apparaît sur ta facture du mois.`,[`Mission ${c}`,'FAQ FFY · Rémunération']);
  if(/gagn|mois|heures|combien/.test(t))return R_('En octobre, tu as gagné <b>412 €</b> pour <b>23 h</b> sur le terrain et 6 missions. 4 missions sont encore prévues cette semaine.',['Ton planning','Tes missions terminées'],[['Voir mon planning','data-act="goMine" data-s="planning"']]);
  if(/prochain|planning|demain|aujourd|quand/.test(t))return R_('Ta prochaine mission : <b>Cabinet Orée · Zone Nord</b>, aujourd’hui de 14h00 à 18h00, départ 12 rue de Bezons à Courbevoie. Demain à 8h00, <b>Studio Pilates Rive</b> : pense à confirmer ta présence, il te reste 3 h 12.',['Ton planning'],[['Voir mon planning','data-act="goMine" data-s="planning"'],['Confirmer Pilates Rive','data-go="detail" data-id="pil"']]);
  if(/stop ?pub|consigne|boite|hlm|brief|regle/.test(t)){const mm=m||M.oree;return R_(mm.svc==='box'?`D’après le brief ${CAMPS[mm.camp].name} : <b>aucun dépôt</b> dans les boîtes avec un autocollant « Stop pub ». Les résidences HLM sont comprises si l’accès est libre, et c’est <b>un seul flyer par boîte</b>.`:`D’après le brief ${CAMPS[mm.camp].name} : ${mm.cons.length?mm.cons.join(' ; '):'pas de consigne particulière'}.`,[`Brief ${CAMPS[mm.camp].name} · page 2`],[['Ouvrir le brief',`data-go="brief" data-id="${mm.id}"`]]);}
  if(/flyer|pack|recup|depot|stock/.test(t))return R_('Les packs sont au <b>dépôt FFY de Courbevoie</b>, rendez-vous à 13h45 (message de Julie dans le chat de la prestation). Pendant la mission, s’il t’en manque, utilise « Demander du stock » : ton chef d’équipe est prévenu tout de suite.',['Chat Cabinet Orée','FAQ FFY · Stock'],[['Ouvrir le chat','data-go="thread" data-id="camp"']]);
  if(/retard|annul|venir|malade|empech/.test(t))return R_('Si tu ne peux pas venir, ouvre la mission puis « Je ne peux pas venir » : plus tu préviens tôt, mieux c’est. Pour un simple retard, préviens ton chef d’équipe dans le chat de la prestation. Je peux aussi transmettre ton message à l’équipe FFY.',['FAQ FFY · Absences et retards'],[['Transmettre à l’équipe FFY','data-act="iaHandoff"']]);
  if(/pause/.test(t))return R_('Dans le mode terrain, appuie sur <b>Pause</b> : le chrono s’arrête et la pause est déduite du temps payé. Pense à reprendre avant de terminer, le check-out n’est pas possible pendant une pause.',['FAQ FFY · Pauses']);
  if(/check|lancer|photo|qr|selfie/.test(t))return R_('Au check-in : vérifie ta batterie et ton brief, puis prends un selfie et une photo du pack, et indique le nombre de flyers au départ. Pour une mission Hand avec suivi, tu scannes aussi le QR code du pack (ou tu saisis le code promo).',['FAQ FFY · Check-in']);
  return R_('Je n’ai pas trouvé la réponse dans tes missions, tes briefs ni la FAQ FFY. Tu veux que je transmette ta question à l’équipe FFY ? Ils te répondent dans ton fil Équipe FFY.',[],[['Transmettre à l’équipe FFY','data-act="iaHandoff"']]);
}
const iaSugg=ctx=>ctx?(M[ctx].svc==='box'?['Quelles consignes pour le stop pub ?','Où récupérer mes flyers ?','Combien je vais gagner ?','Je vais être en retard']:['Quelles sont les consignes ?','Combien je vais gagner ?','Comment se passe le check-in ?','Je vais être en retard']):['Quand suis-je payé ?','Quelle est ma prochaine mission ?','Combien j’ai gagné ce mois-ci ?','Comment faire une pause ?'];
function iaInit(p){const ctx=p.m||null;if(S.ia.ctx===ctx&&S.ia.msgs.length&&!p.demo)return;S.ia={ctx,msgs:[]};const m=ctx?M[ctx]:null;

R.assistant=p=>{iaInit(p);const ctx=S.ia.ctx,m=ctx?M[ctx]:null;

  return {tabs:false,html:`<div class="chathead">${backBtn}<span class="iah">${ic('spark','sm')}</span><div class="ttl"><b>Assistant FFY</b><span>IA · réponse immédiate, 24 h/24</span></div><button class="ib" data-act="iaHandoff" aria-label="Parler à l’équipe FFY">${ic('user','sm')}</button></div>
    <div class="offbar">${ic('info','xs')}Hors connexion · l’assistant a besoin de réseau</div>
    <div class="chatscroll" id="thBody"><div class="cinfo">${ic('info','sm')}<span>Réponses générées par IA à partir de tes missions, de tes briefs et de la FAQ FFY. Pour un problème urgent sur le terrain, contacte ton chef d’équipe.</span></div>
      ${m?`<div class="ictx">${svcChip(m.svc)}<span>À propos de <b>${CAMPS[m.camp].name} · ${m.zone}</b></span><button data-act="iaCtxOff" aria-label="Retirer le contexte">${ic('x','xs')}</button></div>`:''}
      <div class="msgs">${h}</div></div>
    <form class="composer ${S.online===false?'off':''}" onsubmit="return iaSend(event)"><input id="cInput" placeholder="${S.online===false?'Disponible au retour du réseau':'Pose ta question…'}" autocomplete="off" aria-label="Ta question"><button class="send" aria-label="Envoyer">${ic('send','sm')}</button></form>`,
    after:()=>{const b=$('#thBody');b.scrollTop=b.scrollHeight;}};};
function iaPush(q){if(!q)return;const ctx=S.ia.ctx;S.ia.msgs.push({me:1,t:q});const ty={typing:1};S.ia.msgs.push(ty);rerender();
  setTimeout(()=>{const i=S.ia.msgs.indexOf(ty);if(i>=0)S.ia.msgs.splice(i,1,{bot:1,...iaAnswer(q,ctx)});if(S.cur==='assistant')rerender();},900);}
function iaSend(e){e.preventDefault();const v=$('#cInput').value.trim();iaPush(v);return false;}

A.iaHandoff=()=>{const last=[...S.ia.msgs].reverse().find(x=>x.me);openSheet(`<div class="h3">Transmettre à l’équipe FFY ?</div><p class="lead">Ta question part dans ton fil Équipe FFY avec le résumé de la conversation. Un membre de l’équipe Production te répond, en général dans l’heure en journée.</p>${last?`<div class="cinfo" style="margin:12px 0 0"><span>« ${esc(last.t)} »</span></div>`:''}<button class="btn p" data-act="iaHandoffOk">Transmettre</button><button class="btn s" data-act="closeSheet">Annuler</button>`);};

S.zOpen=null;S.zFocus=null;
const zoneVB=z=>{const b=zBB(z),w=b[2]-b[0],h=b[3]-b[1],mw=Math.max(0,240-w)/2,mh=Math.max(0,190-h)/2;return fitVB([b[0]-mw,b[1]-mh,b[2]+mw,b[3]+mh],[96,375],26);};
const zBB=z=>{const a=z.pts.split(' ').map(p=>p.split(',').map(Number));return[Math.min(...a.map(p=>p[0])),Math.min(...a.map(p=>p[1])),Math.max(...a.map(p=>p[0])),Math.max(...a.map(p=>p[1]))];};
function keepSheet(fn){const s=$('#tSheet'),t=s?s.scrollTop:0;fn();const s2=$('#tSheet');if(s2)s2.scrollTop=t;}
A.zAcc=el=>{const id=el.dataset.p;keepSheet(()=>{if(S.zOpen===id){S.zOpen=null;if(S.zFocus&&(GEO.teamZones.find(z=>z.id===S.zFocus)||{}).owner===id)S.zFocus=null;}else S.zOpen=id;rerender();});};

  if(S.zFocus===z.id&&el.closest('svg')){S.zFocus=null;keepSheet(rerender);animVB(zonesVB());return;}

  return chefSeg()+`<div style="display:flex;gap:8px;align-items:center">${svcChip(m.svc)}<b style="font-size:16px">Répartition des zones</b></div><div class="small" style="margin:4px 0 12px">${m.title} · ${dayLabel(m.day)} · début ${m.h1.replace(':','h')} · ${GEO.teamZones.length} zones, ${TEAM.length+1} SM</div>
    ${teamAcc(false)}<button class="btn p" style="margin-top:14px" data-act="checkinStart">Lancer ma mission</button>`;}

/* routes : ?sm= (SM déplié) et ?zone= (zone zoomée) sur Répartition / Mon équipe */
screenPath=(o=>(n,p)=>{let r=o(n,p);if(r&&n==='terrain'&&S.T&&S.T.team&&S.role==='chef'){const q=S.zFocus?'zone='+S.zFocus:(S.zOpen&&S.zOpen!=='_none')?'sm='+S.zOpen:'';if(q)r+=(r.includes('?')?'&':'?')+q;}return r;})(screenPath);
route=(o=>h=>{const qs=(h||'').split('?')[1]||'',q=Object.fromEntries(new URLSearchParams(qs));
  const z=q.zone&&GEO.teamZones.find(x=>x.id===q.zone);S.zFocus=z?z.id:null;S.zOpen=z?(z.owner||'_none'):(q.sm||null);
  const ok=o(h);if(ok&&z&&S.T&&S.T.team){S.T.vb=zoneVB(z);_routing=true;rerender();_routing=false;}return ok;})(route);
A.tPane=el=>{S.T.team=el.dataset.p==='team';S.zFocus=null;S.T.vb=initVB(S.T.id);rerender();};
/* page responsive : navigation synchronisée entre appareils */
(function(){if(!window.__device||window.parent===window)return;
  window.addEventListener('message',e=>{const d=e.data;if(!d||d.ffy!=='go'||d.hash===location.hash)return;window.__mute=Date.now()+900;location.hash=d.hash;});
  const post=()=>{if(window.__lastH===location.hash)return;window.__lastH=location.hash;if(window.__mute&&Date.now()<window.__mute)return;try{parent.postMessage({ffy:'hash',hash:location.hash,dev:new URLSearchParams(location.search).get('device')},'*');}catch(e){}};
  window.__lastH=location.hash;setInterval(post,300);})();

if(!route(location.hash))show('home');
