A.confirmPres=el=>{const m=M[el.dataset.id];openSheet(`<div class="h3">Confirmer ta présence</div><p class="lead">${m.title}<br>${dayLabel(m.day)} · ${hh(m)} · ${m.addr}</p>${m.backup?`<div class="infocard warn">${ic('info','sm')}<span>Tu confirmes en tant que <b>backup</b> : bonus de ${m.bonus} € si tu remplaces un titulaire. Tu risques des pénalités si tu n’es pas à l’heure.</span></div>`:`<p class="lead">En confirmant, tu t’engages à être au point de départ 10 min avant le début.</p>`}<button class="btn p" data-act="confirmOk" data-id="${m.id}">Je confirme</button><button class="btn s" data-act="cantCome" data-id="${m.id}">Je ne pourrai pas venir</button>`);};
A.confirmOk=el=>{const m=M[el.dataset.id];m.st='lancement';closeSheet();rerender();toast('Présence confirmée. Rendez-vous '+dayLabel(m.day).toLowerCase()+' à '+m.h1.replace(':','h')+'.');};
A.cantCome=el=>{openSheet(`<div class="h3">Tu ne peux pas venir ?</div><p class="lead">Préviens-nous le plus tôt possible : ton créneau sera proposé à un autre SM. Au-delà de la limite, la candidature est annulée automatiquement.</p><label class="field"><textarea class="inp" placeholder="Un mot pour l’équipe (facultatif)"></textarea></label><button class="btn p" data-act="cantOk" data-id="${el.dataset.id}">Libérer mon créneau</button><button class="btn s" data-act="closeSheet">Annuler</button>`);};
A.cantOk=el=>{const m=M[el.dataset.id];m.st='refusee';m.refus='Tu as libéré ce créneau.';closeSheet();reset('home');toast('Créneau libéré. Merci de nous avoir prévenus.');};

/* ================= Missions : agenda ================= */
const unreadCount=()=>Object.values(TH).filter(t=>!t.chef||S.role==='chef').reduce((a,t)=>a+t.unread,0);
const missionsHead=v=>`<div class="ah" style="padding-bottom:10px"><h4>Missions</h4><div class="ibtns"><button class="ib" data-go="inbox" aria-label="Messages">${ic('chat')}${unreadCount()?`<span class="badge">${unreadCount()}</span>`:''}</button></div></div>
  <div class="seg"><button class="${v==='agenda'?'on':''}" data-act="mView" data-v="agenda">${ic('list','sm')}Agenda</button><button class="${v==='camps'?'on':''}" data-act="mView" data-v="camps">${ic('box','sm')}Campagnes</button></div>`;
A.mView=el=>{S.view=el.dataset.v;S.stack=[];show(S.view==='camps'?'camps':'missions');};
const tagsFor=m=>`${m.backup?`<span class="tagx bk">BACKUP${m.bonus?' · +'+m.bonus+' €':''}</span>`:''}${S.role==='chef'&&m.chefable?`<span class="tagx chef">${ic('crown','xs')}CHEF</span>`:''}`;
function mineCard(m){
  const run=S.T&&S.T.id===m.id&&S.T.phase==='run';
  return `<div class="tl"><div class="h"><b>${m.h1}</b><span>${m.h2}</span></div>
    <button class="mc" style="--c:${SVC[m.svc].c}" ${run?'data-act="toTerrain"':`data-go="detail" data-id="${m.id}"`}><div class="bar"></div><div class="in">
    <div class="l1"><span style="display:flex;gap:6px;align-items:center">${svcChip(m.svc)}${tagsFor(m)}</span>${run?pill(S.T.paused?'En pause':'En cours',S.T.paused?'--ffy-yellow':'--ffy-success',1):stPill(m,1)}</div>
    <div class="tt">${m.title}</div><div class="ss">${CAMPS[m.camp].place} · ${pay(m)} € estimés${m.st==='confirm'?` · <b style="color:var(--ffy-black)">encore ${m.left}</b>`:''}</div></div></button></div>`;
}
function offerCard(m,single){
  return `<div class="offer" role="button" tabindex="0" data-go="detail" data-id="${m.id}">
    <div class="l1"><span class="tag-offer">${ic('plus','xs')}${m.backup?'Backup':'Disponible'}</span><span style="display:flex;gap:6px">${m.backup?`<span class="tagx bk">+${m.bonus} €</span>`:''}${svcChip(m.svc)}</span></div>
    <div class="tt">${m.title}</div><div class="ss">${hh(m)} · ${CAMPS[m.camp].place} · ${CAMPS[m.camp].dist}</div>
    <div class="l3"><span class="pay">${pay(m)} € <small>· ${m.rate} €/h</small></span><span class="muted" style="font-size:12px;font-weight:600">${m.places} place${m.places>1?'s':''}</span></div></div>`;
}
const FILTERS=[['all','Tout'],['mine','Mes missions'],['dispo','À prendre'],['past','Passées']];
R.missions=()=>{
  const f=S.filter;let html='';
  if(f==='past'){
    const past=Object.values(M).filter(m=>isMine(m)&&(m.day<0||m.st==='refusee'||m.st==='terminee')).sort((a,b)=>b.day-a.day);
    html=past.map(m=>`<div class="day">${dayLabel(m.day)}<span>${dayInfo(m.day).s} ${dayInfo(m.day).n} ${dayInfo(m.day).m}</span></div>${mineCard(m)}`).join('')||'<div class="empty">Aucune mission passée.</div>';
  }else{
    for(let d=0;d<=4;d++){
      const mine=Object.values(M).filter(m=>m.day===d&&isMine(m)&&m.st!=='refusee'&&f!=='dispo').sort((a,b)=>toMin(a.h1)-toMin(b.h1));
      const off=Object.values(M).filter(m=>m.day===d&&visibleOffer(m)&&f!=='mine');
      if(!mine.length&&!off.length){if(f==='all'&&d<2)html+=`<div class="day" id="day${d}">${dayLabel(d)}<span>${dayInfo(d).s} ${dayInfo(d).n} ${dayInfo(d).m}</span></div><div class="empty-day">Rien de prévu</div>`;continue;}
      html+=`<div class="day" id="day${d}">${dayLabel(d)}<span>${dayInfo(d).s} ${dayInfo(d).n} ${dayInfo(d).m}</span></div>`;
      html+=mine.map(mineCard).join('');
      if(off.length)html+=`<div class="sub-h"><i class="o"></i>À prendre ce jour · ${off.length}</div><div class="offers ${off.length===1?'single':''}">${off.map(m=>offerCard(m)).join('')}</div>`;
    }
  }
  const wk=[-1,0,1,2,3,4,5].map(d=>{const i=dayInfo(d);const mine=Object.values(M).some(m=>m.day===d&&isMine(m)&&m.st!=='refusee');const dis=Object.values(M).some(m=>m.day===d&&visibleOffer(m));return `<button class="d ${d===0?'on':''}" data-act="weekDay" data-d="${d}">${i.s}<b>${i.n}</b><span class="mk">${mine?'<i></i>':''}${dis?'<i class="o"></i>':''}</span></button>`;}).join('');
  return {tabs:true,html:`<div class="scroll" id="agendaScroll">${missionsHead('agenda')}
    ${f!=='past'?`<div class="week">${wk}</div><div class="legend"><span><i></i>Tes missions</span><span><i class="o"></i>À prendre</span></div>`:''}
    <div class="chips">${FILTERS.map(([k,l])=>`<button class="chip ${f===k?'on':''}" data-act="mFilter" data-f="${k}">${l}</button>`).join('')}</div>
    ${S.acct==='rdv'&&f!=='past'?`<div class="infocard warn">${ic('lock','sm')}<span>Tu peux consulter les missions. La candidature s’ouvre quand tes deux rendez-vous sont validés.</span></div>`:''}
    ${html}</div>`};
};
A.mFilter=el=>{S.filter=el.dataset.f;rerender();};
A.weekDay=el=>{$$('.week .d').forEach(x=>x.classList.toggle('on',x===el));const t=$('#day'+el.dataset.d);if(t)$('#agendaScroll').scrollTo({top:t.offsetTop-10,behavior:'smooth'});else toast('Aucune mission ce jour-là.');};

/* ================= Missions : campagnes ================= */
R.camps=()=>{
  const groups={};Object.values(M).filter(m=>m.day>=0&&m.st!=='refusee').forEach(m=>{if(isOffer(m)&&!visibleOffer(m))return;(groups[m.camp]=groups[m.camp]||[]).push(m);});
  const card=(ck,list)=>{
    const c=CAMPS[ck];list.sort((a,b)=>a.day-b.day||toMin(a.h1)-toMin(b.h1));
    const mineC=list.some(isMine);
    const rates=[...new Set(list.map(m=>m.rate))],hours=[...new Set(list.map(m=>m.hours))];
    const svc=list[0].svc;
    const row=m=>{
      const i=dayInfo(m.day);let b,right;
      if(isMine(m)){b=stPill(m,1);right=ic('down','sm chev');}
      else{b=`${m.zone} · ${m.places} place${m.places>1?'s':''}${m.backup?' · backup +'+m.bonus+' €':''}`;right=`<span class="price">${pay(m)} €</span>${ic('down','sm chev')}`;}
      return `<button class="slot2 ${isOffer(m)?'dispo':''}" data-go="detail" data-id="${m.id}"><span class="dt"><small>${i.s}</small><b>${i.n}</b></span><span class="grow"><span class="a" style="display:block">${hh(m)}${isMine(m)?' · '+m.zone:''}</span><span class="b" style="display:block">${b}</span></span>${right}</button>`;
    };
    const open=S.openCamp[ck];const shown=open?list:list.slice(0,3);
    return `<div class="camp ${mineC?'':'offer-c'}"><div class="hd"><div class="l1"><span class="tt">${c.name}</span>${svcChip(svc)}</div>
      <div class="ss">${c.place} · ${c.dist}</div><div class="facts"><span>${rates.join(' à ')} €/h</span><span>${hours.join(' ou ')} h par créneau</span><span>${list[0].mob}</span></div></div>
      ${shown.map(row).join('')}${list.length>3?`<button class="morebtn" data-act="more" data-c="${ck}">${open?'Réduire':(list.length-3===1?'Voir le 4e créneau':`Voir les ${list.length-3} autres créneaux`)}${ic('down','sm')}</button>`:''}</div>`;
  };
  const E=Object.entries(groups);
  const mineG=E.filter(([k,l])=>l.some(isMine)),other=E.filter(([k,l])=>!l.some(isMine)).sort((a,b)=>parseFloat(CAMPS[a[0]].dist.replace(',','.'))-parseFloat(CAMPS[b[0]].dist.replace(',','.')));
  return {tabs:true,html:`<div class="scroll">${missionsHead('camps')}
    <div class="sec-t" style="margin-top:18px">Tes campagnes · ${mineG.length}</div>${mineG.map(([k,l])=>card(k,l)).join('')}
    <div class="sec-t">À prendre près de toi · ${other.length}</div>${other.map(([k,l])=>card(k,l)).join('')}</div>`};
};
A.more=el=>{S.openCamp[el.dataset.c]=!S.openCamp[el.dataset.c];rerender();};

/* ================= Détail mission ================= */
R.detail=p=>{
  const m=M[p.id];const tab=p.tab||'mission';const run=S.T&&S.T.id===m.id&&S.T.phase==='run';
  const tabs=[['mission','Mission'],['lieu','Lieu et horaires']];if(m.st==='terminee')tabs.push(['recap','Récap']);
  let body='';
  if(tab==='mission'){
    body+=`<div class="card" style="margin-top:14px;${isOffer(m)?'background:var(--offer-bg);box-shadow:none;border:1.5px solid var(--offer-bd)':''}">
      <div style="display:flex;justify-content:space-between;align-items:baseline"><span class="muted" style="font-size:14px">Rémunération estimée</span><b style="font-size:24px;letter-spacing:-.4px">${pay(m)} €</b></div>
      <div class="muted" style="font-size:13px;margin-top:4px">${m.rate} €/h × ${m.hours} h${m.backup?` · bonus backup +${m.bonus} € si tu remplaces un titulaire`:''}</div></div>`;
    if(m.backup)body+=`<div class="infocard warn">${ic('info','sm')}<span>${isOffer(m)?'Mission en <b>backup</b> : tu restes disponible au cas où un titulaire se désiste. Tu es payé·e et tu touches le bonus si tu es appelé·e.':'Tu as été <b>pré-sélectionné·e en backup</b>. Confirme ta présence pour garder ta place, sinon elle sera proposée à un autre SM.'}</span></div>`;
    if(m.st==='refusee')body+=`<div class="infocard bad">${ic('info','sm')}<span><b>Candidature non retenue.</b><br>${m.refus}</span></div>`;
    if(m.st==='candidature')body+=`<div class="infocard">${ic('clock','sm')}<span>Ta candidature est en cours d’examen. Tu recevras une notification dès que l’équipe aura répondu.</span></div>`;
    body+=`<div class="sec-t">À propos</div><div class="card"><p class="brief">${m.desc}</p></div>
      <div class="sec-t">Infos pratiques</div><div class="card" style="padding:4px 16px"><div class="info">
      <div class="r"><span>Ton rôle</span><span>${S.role==='chef'&&m.chefable?'Chef d’équipe':'Distributeur'}</span></div>
      <div class="r"><span>Mobilité</span><span>${m.mob}</span></div>
      ${m.cons.map((c,i)=>`<div class="r"><span>${i?'':'Consignes'}</span><span>${c}</span></div>`).join('')}
      ${m.formats.map((f,i)=>`<div class="r"><span>${i?'':'Supports'}</span><span>${f[0]} · ${f[1]} ex.</span></div>`).join('')}
      ${m.qr?`<div class="r"><span>Suivi</span><span>QR code ou code promo</span></div>`:''}
      </div></div>
      <div class="sec-t">Brief</div><div class="card" style="padding:2px 16px">
      ${isMine(m)&&m.st!=='candidature'&&m.st!=='refusee'?`<button class="brow" data-go="brief" data-id="${m.id}"><span class="lead-ic" style="width:36px;height:36px;border-radius:10px;background:var(--ffy-bg-hover);display:grid;place-items:center">${ic('file','sm')}</span><span class="grow"><span class="t" style="display:block">Brief ${SVC[m.svc].n}</span><span class="s">${m.brief?'Lu':'À lire avant de lancer la mission'}</span></span>${m.brief?`<span style="color:var(--ffy-success)">${ic('check','sm')}</span>`:pill('À lire','--ffy-yellow',1)}</button>`:`<div class="brow"><span class="grow"><span class="s">Le brief complet est accessible une fois ta candidature validée.</span></span>${ic('lock','sm')}</div>`}</div>`;
    if(isMine(m)&&['valide','confirm','lancement','encours'].includes(m.st))body+=`<button class="card" data-go="thread" data-id="${m.id==='pil'?'pilc':'camp'}" style="margin-top:12px;width:100%;display:flex;align-items:center;gap:12px;text-align:left"><span class="th" style="padding:0;border:0;width:auto"><span class="ic camp">${ic('hash','sm')}</span></span><span style="flex:1"><b style="font-size:15px">Chat de la prestation</b><br><span class="muted" style="font-size:13px">SM de la prestation · équipe Production</span></span>${ic('down','sm chev')}</button>`;
  }
  if(tab==='lieu'){
    body+=`<div class="mapsm" style="height:200px">${staticMap(m,200)}<span class="lbl">Aperçu statique</span></div>
      <div class="card" style="margin-top:12px"><div class="route2"><span class="dot"></span><span><b>Chez toi</b><br><span class="muted">8 rue des Lilas, Courbevoie</span></span><span class="ln"></span><span class="muted">${CAMPS[m.camp].dist}</span><span class="dot end"></span><span><b>${m.svc==='hand'?'Spot de distribution':m.svc==='store'?'Premier commerce':'Point de départ'}</b><br><span class="muted">${m.addr}</span></span></div>
      <button class="btn s" style="margin-top:14px" data-act="toast" data-msg="Ouverture de l’itinéraire dans Google Maps.">${ic('route','sm')}Voir le trajet</button></div>
      <div class="sec-t">Horaires</div><div class="card" style="padding:4px 16px"><div class="info"><div class="r"><span>Date</span><span>${dayLabel(m.day)} ${dayInfo(m.day).n} ${dayInfo(m.day).m}</span></div><div class="r"><span>Créneau</span><span>${hh(m)}</span></div><div class="r"><span>Arrivée conseillée</span><span>10 min avant</span></div></div></div>`;
  }
  if(tab==='recap'){
    const r=m.recap;
    body+=r?`<div class="infocard good">${ic('check','sm')}<span><b>Mission validée par l’équipe.</b> Elle apparaîtra sur ta facture d’octobre.</span></div>
      <div class="rec"><div><b>${r.ci} → ${r.co}</b><span>check-in → check-out</span></div><div><b>${r.paid}</b><span>temps retenu</span></div><div><b>${r.pauses.split(' · ')[1]}</b><span>${r.pauses.split(' · ')[0]} déduite</span></div><div><b>${r.amount}</b><span>montant validé${r.bonus?' · bonus '+r.bonus+' €':''}</span></div><div><b>${r.dist}</b><span>parcourus</span></div><div><b>${r.flyers}</b><span>flyers distribués</span></div></div>
      <div class="sec-t">Retour de l’équipe</div><div class="card"><div class="stars">${Array.from({length:5},(_, i)=>`<svg class="i" style="opacity:${i<r.note?1:.25}"><use href="#i-star"/></svg>`).join('')}</div><p class="brief" style="margin-top:8px">${r.comment}</p><p class="small" style="margin-top:6px">Thomas · équipe Production</p></div>`
      :`<div class="infocard">${ic('clock','sm')}<span>Ta mission est <b>en cours de validation</b>. Tu verras ici les heures retenues, les pauses déduites, ton bonus et le retour de l’équipe.</span></div>
      <div class="rec"><div><b>${fmt(S.lastRun?S.lastRun.active:0).slice(0,5)}</b><span>temps actif déclaré</span></div><div><b>${S.lastRun?S.lastRun.pauses:0}</b><span>pause(s)</span></div></div>`;
  }
  let cta='';
  if(isOffer(m)){
    if(S.acct==='rdv')cta=`<button class="btn s" disabled>${ic('lock','sm')}Termine tes RDV pour postuler</button>`;
    else cta=`<button class="btn g" data-act="${m.backup?'applyBackup':'apply'}" data-id="${m.id}">${m.backup?'Je veux postuler en backup':'Postuler à cette mission'}</button>`;
  }else if(m.st==='candidature')cta=`<button class="btn s" data-act="withdraw" data-id="${m.id}">Retirer ma candidature</button>`;
  else if(m.st==='confirm')cta=`<button class="btn p" data-act="confirmPres" data-id="${m.id}">Je confirme ma présence</button>`;
  else if(m.st==='valide')cta=`<button class="btn s" disabled>La confirmation de présence s’ouvre la veille</button>`;
  else if(m.st==='lancement')cta=run?`<button class="btn g" data-act="toTerrain">Revenir au mode terrain</button>`:`<button class="btn p" data-act="launch" data-id="${m.id}">Lancer la mission</button>`;
  else if(m.st==='terminee')cta=`<button class="btn s" data-go="invoices">Voir mes factures</button>`;
  return {tabs:false,html:`<div class="scroll" style="bottom:${cta?100:0}px;padding-top:0">
    <div class="dmap">${staticMap(m,190)}<button class="ib js-back" aria-label="Retour">${ic('back')}</button></div>
    <div style="display:flex;gap:6px;align-items:center;margin-top:16px;flex-wrap:wrap">${svcChip(m.svc)}${isOffer(m)?`<span class="tag-offer">${m.backup?'Backup':'Disponible'} · ${m.places} place${m.places>1?'s':''}</span>`:(run?pill('En cours','--ffy-success'):stPill(m))}${tagsFor(m)}${m.qr?`<span class="tagx qr">${ic('qr','xs')}QR</span>`:''}</div>
    <h2 style="font-size:22px;font-weight:700;letter-spacing:-.4px;margin-top:10px">${m.title}</h2>
    <div class="muted" style="font-size:14px;margin-top:4px">${dayLabel(m.day)} · ${hh(m)} · ${CAMPS[m.camp].place}</div>
    ${m.st==='confirm'?`<div class="countdown">${ic('clock')}<div><b>${m.left}</b><div class="small">pour confirmer ta présence, sinon le créneau est libéré</div></div></div>`:''}
    <div class="dtabs">${tabs.map(([k,l])=>`<button class="${tab===k?'on':''}" data-act="dTab" data-t="${k}">${l}</button>`).join('')}</div>
    ${body}</div>${cta?`<div class="sticky">${cta}</div>`:''}`};
};
A.dTab=el=>{S.params.tab=el.dataset.t;show('detail',S.params);};
A.apply=el=>{const m=M[el.dataset.id];openSheet(`<div class="h3">Postuler à cette mission ?</div><p class="lead">${m.title}<br>${dayLabel(m.day)} · ${hh(m)} · ${pay(m)} € estimés</p><p class="lead">L’équipe valide les candidatures en fonction des besoins. Tu seras notifié·e de la réponse.</p><button class="btn g" data-act="applyOk" data-id="${m.id}">Je postule</button><button class="btn s" data-act="closeSheet">Annuler</button>`);};
A.applyBackup=el=>{const m=M[el.dataset.id];openSheet(`<div class="h3">Postuler en tant que backup</div><p class="lead">Tu viens de postuler en tant que backup sur cette mission. Si tu es appelé·e, tu touches un bonus de ${m.bonus} €. Tu risques des pénalités si tu n’es pas à l’heure ou si tu ne mènes pas ta mission à bien.</p><button class="btn g" data-act="applyOk" data-id="${m.id}">Postuler quand même</button><button class="btn s" data-act="closeSheet">Retour</button>`);};
A.applyOk=el=>{const m=M[el.dataset.id];m.st='candidature';closeSheet();show('detail',{id:m.id});toast('Candidature envoyée. Tu seras notifié·e de la réponse.');};
A.withdraw=el=>{const m=M[el.dataset.id];m.st='dispo';m.places=m.places||1;show('detail',{id:m.id});toast('Candidature retirée.');};

/* ================= Brief ================= */
R.brief=p=>{const m=M[p.id];const pg=+(p.pg||0);
  const pages=[
    `<div class="bpage"><div class="k">Brief de campagne</div><h3>${CAMPS[m.camp].name} × ${SVC[m.svc].n}</h3><p>${m.desc}</p><ul><li>${hh(m)} · ${dayLabel(m.day)}</li><li>${m.formats.map(f=>f[0]+' · '+f[1]+' ex.').join(', ')}</li>${m.cons.map(c=>`<li>${c}</li>`).join('')}</ul></div>`,
    `<div class="bpage light"><div class="k">Attention</div><h3>Les règles à respecter</h3><ul><li>Check-in au point de départ, avec un selfie et une photo du pack.</li><li>Pas de dépôt dans les boîtes « Stop pub ».</li><li>Signale toute anomalie (badge, loge, accès fermé) dans l’app.</li><li>En cas de problème, contacte ton chef d’équipe ou l’équipe FFY dans le chat.</li></ul></div>`,
    `<div class="bpage"><div class="k">Questions ?</div><h3>On est là</h3><p>Chef de projet : Julie · équipe Production</p><p style="margin-top:8px">Écris dans le chat de la prestation, on répond en moins de 15 min pendant les missions.</p></div>`];
  return {tabs:false,html:`<div class="scroll" style="bottom:100px"><div class="hdr"><button class="xbtn js-back" aria-label="Fermer">${ic('x')}</button><div class="ttl"><b>Brief · ${CAMPS[m.camp].name}</b><span>Page ${pg+1} sur ${pages.length}</span></div></div>
    ${pages[pg]}<div class="bnav">${pages.map((_,i)=>`<i class="${i===pg?'on':''}"></i>`).join('')}</div></div>

A.zonesList=()=>openSheet(`<div class="h3">Zones de distribution</div><p class="lead">${M[S.T.id].title} · 2 zones</p><div style="margin-top:8px">${GEO.box.zones.map(z=>`<button class="dest" data-act="zoneGo" data-x="${z.c[0]}" data-y="${z.c[1]}"><span class="ic" style="background:var(--svc-box);color:#fff;font-weight:700;font-size:12px">${z.n}</span><span><span class="t" style="display:block">${z.name}</span><span class="s">Voir sur la carte</span></span></button>`).join('')}</div>`);
A.zoneGo=el=>{closeSheet();animVB(vbAround(+el.dataset.x,+el.dataset.y,240));};
A.spotInfo=()=>{const m=M[S.T.id];openSheet(`<div class="h3">${m.spot.name}</div><div class="card" style="padding:4px 16px;margin-top:12px;box-shadow:none;background:var(--ffy-bg-hover)"><div class="info"><div class="r"><span>Adresse</span><span>${m.addr}</span></div><div class="r"><span>Type</span><span>${m.spot.type}</span></div><div class="r"><span>Description</span><span>${m.spot.desc}</span></div></div></div><button class="btn p" data-act="routeTo" data-x="${GEO.hand.spot[0]}" data-y="${GEO.hand.spot[1]}" data-label="${m.spot.name}">${ic('route','sm')}Itinéraire jusqu’au spot</button>`);};
A.storeList=()=>openSheet(`<div class="h3">Commerces de la tournée</div><div class="pts">${SHOPS.map((s,i)=>`<div class="pt"><span class="num">${i+1}</span><span class="grow"><span class="t" style="display:block">${s[0]}</span><span class="s">${s[1]}</span></span></div>`).join('')}</div>`);

/* ================= Check-in ================= */
A.checkinStart=()=>{const m=M[S.T.id];if(!m.brief){openSheet(`<div class="h3">Tu n’as pas lu ton brief</div><p class="lead">Pour lancer ta mission, il faut que tu lises et comprennes le brief. Ça prend 2 minutes.</p><button class="btn p" data-go="brief" data-id="${m.id}">Lire le brief</button><button class="btn s" data-act="closeSheet">Retour</button>`);return;}go('checkin',{step:'verif'});};
const ciSteps=m=>['verif',...(m.qr?['qr']:[]),'photos'];
const ciLabel={verif:'Vérifications',qr:'QR code',photos:'Photos et flyers'};
R.checkin=p=>{const T=S.T,m=M[T.id],steps=ciSteps(m),k=steps.indexOf(p.step);
  const head=`<div class="hdr"><button class="xbtn" data-act="ciClose" aria-label="Fermer">${ic('x')}</button><div class="ttl"><b>Check-in de mission</b><span>${m.title}</span></div></div><div class="stepdots">${steps.map((s,i)=>`<span class="${i<k?'done':i===k?'on':''}">${ciLabel[s]}</span>`).join('')}</div>`;
  let body='',cta='';
  if(p.step==='verif'){const n=m.svc==='hand'?3:2;
    body=`<div class="ob-h" style="font-size:21px">Avant ton check-in, vérifie bien que :</div><div class="ci-list">
      <div class="ci-item"><span class="n">1</span><div>Ton téléphone ou ta batterie externe est bien chargé.</div></div>
      <div class="ci-item"><span class="n">2</span><div>Tu as bien lu le brief client.<div class="s">${ic('check','xs')} Lu</div></div></div>
      <div class="ci-item"><span class="n">3</span><div>Tu te trouves au point de départ de la mission.<div class="s">${m.svc==='hand'?m.spot.name:m.addr}</div></div></div></div>
      <div class="infocard">${ic('cam','sm')}<span>Ensuite, ${m.qr?'tu scanneras ton pack puis ':''}tu prendras ${n} photos : un selfie, une photo du pack de flyers${m.svc==='hand'?' et une photo du spot':''}.</span></div>`;
    cta=`<button class="btn p" data-act="ciNext">C’est parti</button>`;}
  if(p.step==='qr'){
    body=T.qrDone?`<div class="bigok">${ic('check')}</div><div class="ob-h" style="text-align:center;font-size:21px">Le pack de flyers t’a été attribué</div><p class="ob-p" style="text-align:center">${T.qrDone==='code'?'Code promo':'QR code'} enregistré. Les scans et conversions de ta distribution seront rattachés à ta mission.</p>`
      :`<div class="ob-h" style="font-size:21px">Scanne ton QR code</div><p class="ob-p">Pour lancer ta mission, scanne le QR code présent sur ton pack de flyers. S’il est illisible, saisis le code promo imprimé dessus.</p>
      <div class="pick one" style="margin-top:18px"><button class="pk" data-act="qrScan">${ic('qr')}<span>Scanner le QR code<small>Avec l’appareil photo</small></span></button><button class="pk" data-act="qrCode">${ic('edit')}<span>Saisir le code promo<small>8 caractères, sur le pack</small></span></button></div>`;
    cta=T.qrDone?`<button class="btn p" data-act="ciNext">Continuer</button>`:'';}
  if(p.step==='photos'){const tiles=[['selfie','Un selfie','On doit bien voir ton visage'],['pack','Le pack de flyers','Pris avec du recul, comme sur le brief']];if(m.svc==='hand')tiles.push(['spot','Le spot de distribution','Vue d’ensemble du lieu']);
    body=`<div class="ob-h" style="font-size:21px">Photos et flyers</div><p class="ob-p">Assure-toi que tes photos correspondent à celles du brief.</p>
      ${tiles.map(([k,t,s])=>`<button class="phototile ${T.ci[k]?'done':''}" data-act="ciPhoto" data-k="${k}"><span class="ph ${k}">${T.ci[k]?'':ic('cam')}</span><span><span class="t" style="display:block">${t}</span><span class="s">${T.ci[k]?'Photo prise · toucher pour reprendre':s}</span></span>${T.ci[k]?`<span class="ok">${ic('check')}</span>`:''}</button>`).join('')}
      <div class="flab" style="margin-top:20px">Nombre de supports au départ</div>
      ${m.formats.map((f,i)=>`<div class="numrow"><div><div class="t">${f[0]}</div><div class="s">Prévu : ${f[1]}</div></div><input class="inp" inputmode="numeric" id="fl${i}" value="${T.ci['f'+i]||''}" placeholder="0"></div>`).join('')}`;
    cta=`<button class="btn g" data-act="ciLaunch">Lancer la mission</button>`;}
  return {tabs:false,html:`<div class="scroll" style="bottom:100px">${head}${body}</div>${cta?`<div class="full-cta">${cta}</div>`:''}`};};
A.ciClose=()=>{show('terrain');S.stack=S.stack.filter(x=>x[0]!=='checkin');};
A.ciNext=()=>{const m=M[S.T.id],st=ciSteps(m);const k=st.indexOf(S.params.step);S.stack.push(['checkin',{...S.params}]);show('checkin',{step:st[k+1]});};
A.qrScan=()=>{const cells=Array.from({length:169},(_,i)=>{const r=i/13|0,c=i%13;const fin=(r<3&&c<3)||(r<3&&c>9)||(r>9&&c<3);return `<i class="${fin||(Math.sin(i*7.3)>0.1)?'b':''}"></i>`;}).join('');
  view.insertAdjacentHTML('beforeend',`<div class="cam" id="cam"><button class="xbtn close" data-act="camClose" aria-label="Fermer">${ic('x')}</button><div class="vf"><div class="qrfake">${cells}</div><span class="scanl"></span></div><p>Place le QR code du pack dans le cadre</p></div>`);
  setTimeout(()=>{if($('#cam')){S.T.qrDone='qr';show('checkin',{step:'qr'});toast('QR code reconnu.');}},1700);};
A.camClose=()=>{const c=$('#cam');if(c)c.remove();};
A.qrCode=()=>openSheet(`<div class="h3">Renseigne ton code promo</div><p class="lead">Il est imprimé sur le pack, sous le QR code.</p><label class="field"><input class="inp" id="promo" placeholder="Ex. PILA2610" style="text-transform:uppercase;letter-spacing:.1em;font-weight:700"></label><button class="btn p" data-act="qrCodeOk">Valider le code</button>`);
A.qrCodeOk=()=>{const v=($('#promo')||{}).value||'';if(v.trim().length<4){toast('Saisis le code imprimé sur le pack.');return;}S.T.qrDone='code';closeSheet();show('checkin',{step:'qr'});};
A.ciPhoto=el=>{const k=el.dataset.k;S.T.ci[k]=true;saveCiFlyers();show('checkin',S.params);toast('Photo enregistrée.');};
const saveCiFlyers=()=>{M[S.T.id].formats.forEach((f,i)=>{const e=$('#fl'+i);if(e)S.T.ci['f'+i]=e.value;});};
A.ciLaunch=()=>{const T=S.T,m=M[T.id];saveCiFlyers();const need=['selfie','pack',...(m.svc==='hand'?['spot']:[])];
  if(need.some(k=>!T.ci[k])){toast('Il manque une photo.');return;}
  if(m.formats.some((f,i)=>!(+T.ci['f'+i]>0))){toast('Indique le nombre de supports au départ.');return;}
  T.ci.flyers=+T.ci.f0;T.phase='run';T.start=Date.now();m.st='encours';T.vb=initVB(T.id,'run');T.route=null;
  S.stack=S.stack.filter(x=>x[0]!=='checkin'&&x[0]!=='terrain');show('terrain');toast('Check-in validé. Mission lancée, bonne distribution !');};

/* ================= En mission ================= */
A.pause=()=>{const T=S.T;
  if(!T.paused)openSheet(`<div class="h3">Mettre ta mission en pause ?</div><p class="lead">Le chrono s’arrête et ta pause est déduite du temps payé. Si tu as un problème sur la mission, contacte ton chef d’équipe.</p><button class="btn p" data-act="pauseOk">${ic('pause','sm')}Mettre en pause</button><button class="btn s" data-act="closeSheet">Annuler</button>`);
  else openSheet(`<div class="h3">Reprendre ta mission ?</div><p class="lead">Es-tu sûr·e de vouloir mettre fin à ta pause ? Ta mission reprendra normalement et tu pourras continuer ta distribution.</p><button class="btn g" data-act="resumeOk">${ic('play','sm')}Reprendre la mission</button><button class="btn s" data-act="closeSheet">Rester en pause</button>`);};
A.pauseOk=()=>{const T=S.T,me=meXY();T.paused=true;T.pauseStart=Date.now();T.pauses.push({x:me.x,y:me.y});T.collapsed=false;closeSheet();rerender();};
A.resumeOk=()=>{const T=S.T;T.paused=false;T.pausedTotal+=Date.now()-T.pauseStart;T.pauses[T.pauses.length-1].resumed=true;closeSheet();rerender();toast('C’est reparti !');};
A.photo=()=>openSheet(`<div class="h3">Ajouter une photo</div><p class="lead">Pour ajouter une photo, prends-la directement ou choisis-la dans ta photothèque.</p><button class="btn p" data-act="photoOk">${ic('cam','sm')}Prendre une photo</button><button class="btn s" data-act="photoOk">${ic('image','sm')}Photothèque</button><button class="btn s" data-act="photoSee">Voir mes photos (${S.T.photos})</button>`);
A.photoOk=()=>{S.T.photos++;openSheet(`<div class="bigok">${ic('check')}</div><div class="h3" style="text-align:center">Nous avons bien reçu ta photo, merci !</div><button class="btn p" data-act="closeSheet">Fermer</button>`);};
A.photoSee=()=>{const g=['#f0b27a,#c0664a','#a7c7e7,#e8d9b5','#d5b8e8,#f3e1c7','#fbfaf6,#60eed2'];openSheet(`<div class="h3">Mes photos</div><p class="lead">Tu as ajouté ${S.T.photos+2} photos sur cette mission, check-in compris.</p><div class="gallery">${Array.from({length:S.T.photos+2},(_,i)=>`<i style="background:linear-gradient(135deg,${g[i%4]})"></i>`).join('')}</div><button class="btn s" data-act="photo">Retour</button>`);};
const AN_TYPES=['Pas de système Vigik','Pas de boîte aux lettres','Le badge n’a pas fonctionné','Loge (gardien·ne)','Adresse en travaux','Adresse inaccessible','Entreprise','Résidence ou chemin privé','Route bloquée','Boîte aux lettres inaccessible','Autre'];
A.anomaly=()=>{const n=S.T.anomalies.length;openSheet(`<div class="h3">Anomalies</div><p class="lead">Signale tout ce qui t’empêche de distribuer à une adresse. On les transmet au client dans le rapport.</p><button class="btn p" data-act="anAdd">${ic('plus','sm')}Ajouter une anomalie</button><button class="btn s" data-act="anManage" ${n?'':'disabled'}>Gérer mes anomalies (${n})</button>`);};
A.anAdd=el=>{S.anType=null;const addr=el&&el.dataset&&el.dataset.addr?el.dataset.addr:'14 rue de Bezons, 92400 Courbevoie';S.anPt=el&&el.dataset?el.dataset.i:undefined;
  openSheet(`<div class="h3">Ajouter une anomalie</div><p class="lead">Vérifie que l’adresse pré-remplie est la bonne, sinon modifie-la, puis choisis le type d’anomalie.</p><label class="field"><span class="flab">Adresse</span><input class="inp" id="anAddr" value="${addr}"></label><div class="flab" style="margin-top:16px">Type d’anomalie</div><div class="list-opt" id="anList">${AN_TYPES.map(t=>`<button data-act="anPick">${t}</button>`).join('')}</div><div id="anOther" style="display:none"><label class="field"><span class="flab">Précise</span><textarea class="inp" placeholder="Ex. un chien agressif bloque l’entrée"></textarea></label></div><button class="btn p" data-act="anOk">Valider</button>`);};
A.anPick=el=>{$$('#anList button').forEach(b=>b.classList.toggle('on',b===el));S.anType=el.textContent;$('#anOther').style.display=S.anType==='Autre'?'block':'none';};
A.anOk=()=>{if(!S.anType){toast('Choisis un type d’anomalie.');return;}const T=S.T;const i=S.anPt;const base=i!==undefined?GEO.store.pts[i]:[120+T.anomalies.length*40,250+T.anomalies.length*20];T.anomalies.push({type:S.anType,addr:$('#anAddr').value,x:base[0]+(i!==undefined?16:0),y:base[1]-(i!==undefined?16:0)});if(i!==undefined)T.pts[i].an=true;closeSheet();rerender();toast('Anomalie enregistrée.');};
A.anManage=()=>{const T=S.T;openSheet(`<div class="h3">Gérer mes anomalies</div><p class="lead">Touche une anomalie pour la supprimer.</p><div class="pts">${T.anomalies.map((a,i)=>`<div class="pt an"><span class="num">!</span><span class="grow"><span class="t" style="display:block">${a.type}</span><span class="s">${esc(a.addr)}</span></span><button class="icb" data-act="anDel" data-i="${i}" aria-label="Supprimer">${ic('trash','sm')}</button></div>`).join('')}</div><button class="btn s" data-act="anomaly">Retour</button>`);};
A.anDel=el=>openSheet(`<div class="h3">Supprimer l’anomalie ?</div><p class="lead">Pourquoi veux-tu supprimer cette anomalie ?</p><label class="field"><input class="inp" placeholder="Ex. doublon, erreur d’adresse"></label><button class="btn p" style="background:var(--ffy-danger);color:#fff" data-act="anDelOk" data-i="${el.dataset.i}">Supprimer définitivement</button><button class="btn s" data-act="anManage">Retour</button>`);
A.anDelOk=el=>{S.T.anomalies.splice(+el.dataset.i,1);closeSheet();rerender();toast('Anomalie supprimée.');};
A.remark=()=>{const m=M[S.T.id];openSheet(`<div class="h3">Ajouter une remarque</div><p class="lead">Tu peux ajouter une observation liée à ta distribution : affluence, réactions, problème sur le spot…</p><label class="field"><span class="flab">Adresse</span><input class="inp" value="${m.addr}"></label><label class="field"><span class="flab">Remarque</span><textarea class="inp" id="rmk" placeholder="Ex. beaucoup de monde à 8h, la sortie B est fermée"></textarea></label><button class="btn p" data-act="remarkOk">Valider</button>`);};
A.remarkOk=()=>{const v=$('#rmk').value.trim();if(!v){toast('Écris ta remarque.');return;}S.T.remarks.push(v);closeSheet();rerender();toast('Remarque enregistrée.');};
A.storePt=el=>{const i=+el.dataset.i,p=S.T.pts[i];if(S.T.phase!=='run'){A.storeList();return;}openSheet(`<div class="h3">${i+1}. ${p.name}</div><p class="lead">${p.addr}</p>${p.done?`<div class="infocard good">${ic('check','sm')}<span>Commerce validé, photo envoyée.</span></div>`:`<p class="lead">Dépose le matériel, puis prends une photo de la vitrine ou du comptoir avec les supports visibles.</p><button class="btn g" data-act="ptOk" data-i="${i}">${ic('cam','sm')}Prendre la photo et valider</button>`}<button class="btn s" data-act="anAdd" data-i="${i}" data-addr="${p.addr}">${ic('alert','sm')}Signaler une anomalie</button><button class="btn s" data-act="routeTo" data-x="${GEO.store.pts[i]?GEO.store.pts[i][0]:200}" data-y="${GEO.store.pts[i]?GEO.store.pts[i][1]:300}" data-label="${esc(p.name)}">${ic('route','sm')}Itinéraire</button>`);};
A.ptOk=el=>{const i=+el.dataset.i;S.T.pts[i].done=true;S.T.photos++;closeSheet();rerender();toast('Commerce validé.');};
A.addShop=()=>openSheet(`<div class="h3">Ajouter une adresse hors liste</div><p class="lead">Un commerçant a accepté des supports alors qu’il n’était pas prévu ? Ajoute-le ici.</p><label class="field"><span class="flab">Nom du commerce</span><input class="inp" id="shopN" placeholder="Ex. Épicerie Marius"></label><label class="field"><span class="flab">Adresse</span><input class="inp" id="shopA" value="18 rue Voltaire, Puteaux"></label><button class="btn p" data-act="addShopOk">Ajouter à ma tournée</button>`);
A.addShopOk=()=>{const n=$('#shopN').value.trim()||'Commerce ajouté';S.T.pts.push({name:n,addr:$('#shopA').value,done:false,an:false,extra:1});closeSheet();rerender();toast('Commerce ajouté à ta tournée.');};

/* stock (SM) et réappro (chef) */
A.stockAsk=()=>openSheet(`<div class="h3">Demander du stock</div><p class="lead">Karim A., ton chef d’équipe, reçoit une alerte et te voit en tête de sa liste.</p><div class="flab" style="margin-top:16px">Il te reste environ</div><div class="opts" id="stockOpts">${['Presque plus','~ 50','~ 100','~ 250'].map(x=>`<button class="opt" data-act="stockPick">${x}</button>`).join('')}</div><label class="field"><textarea class="inp" style="min-height:64px" placeholder="Un mot pour Karim (facultatif) : où tu es, etc."></textarea></label><button class="btn p" data-act="stockSend">Prévenir Karim</button>`);
A.stockPick=el=>{$$('#stockOpts .opt').forEach(o=>o.classList.toggle('on',o===el));S.stockPick=el.textContent;};
A.stockSend=()=>{if(!S.stockPick){toast('Indique à peu près combien il te reste.');return;}S.stockPick=null;S.T.stockReq=Date.now();closeSheet();rerender();toast('Karim a été prévenu.');setTimeout(()=>{if(S.T&&S.T.stockReq){S.rVal=200;openRecu();}},5000);};
function openRecu(){openSheet(`<div style="display:flex;gap:12px;align-items:center"><div class="av2" style="--c:#e0634a">KA</div><div><div class="h3">Karim t’a rechargé</div><p class="lead" style="margin:0">Confirme la quantité reçue</p></div></div><div class="stepper" style="margin-top:18px"><button data-act="rStep" data-d="-50" aria-label="Retirer 50">−</button><div class="v"><b id="rVal">${S.rVal}</b><span>flyers reçus</span></div><button data-act="rStep" data-d="50" aria-label="Ajouter 50">+</button></div><p class="small" style="margin-top:8px">Montant déclaré par Karim : 200. Ajuste si ce n’est pas le bon nombre.</p><button class="btn p" data-act="rOk" id="rOk">${S.rVal===200?'Je confirme 200 flyers':'Signaler : j’en ai reçu '+S.rVal}</button>`);}
A.rStep=el=>{S.rVal=Math.max(0,S.rVal+ +el.dataset.d);openRecu();};
A.rOk=()=>{const T=S.T;T.recharged+=S.rVal;T.stockReq=null;closeSheet();rerender();toast(S.rVal===200?'Rechargement confirmé : +200 flyers.':`Écart signalé à Karim et à l’équipe FFY (${S.rVal} reçus au lieu de 200).`);};
function teamList(){return (typeof teamHead==='function'?teamHead():'')+TEAM.map(p=>{let st=p.st,sc=p.sc,hot=p.hot;
  let btn=p.act==='recharge'&&!S.leaState?`<button class="btn g sm" data-act="reappro">${ic('box','sm')}Recharger</button>`:`<button class="icb" data-act="routeTo" data-x="${p.x}" data-y="${p.y}" data-label="${p.name}" aria-label="Itinéraire vers ${p.name}">${ic('route','sm')}</button>`;
  if(p.id==='lea'&&S.leaState){hot=0;sc='var(--ffy-success)';st=S.leaState==='pending'?'Rechargée +'+S.qVal+' · attend sa confirmation':'Rechargée +'+S.qVal+' · confirmé par Léa';}
  return `<div class="tm ${hot?'hot':''}"><div class="av2" style="--c:${p.c}">${p.ini}</div><div class="grow"><div class="nm">${p.name}</div><div class="st ${p.alert?'alert':''}" style="--sc:${sc}"><i></i>${st}${p.ago&&!S.leaState?' · '+p.ago:''}</div>${typeof zoneChips==='function'?zoneChips(p.id):''}</div>${btn}</div>`;}).join('')+`<p class="small" style="margin-top:10px">Triée par urgence : demandes de stock, puis hors zone, puis pauses et actifs.</p>`;}
A.reappro=()=>{S.qVal=S.qVal||200;openReappro();};
function openReappro(){openSheet(`<div style="display:flex;gap:12px;align-items:center"><div class="av2" style="--c:#3f8f6b">LB</div><div><div class="h3">Recharger Léa</div><p class="lead" style="margin:0">Elle a demandé du stock · il lui reste ~ 100</p></div></div><div class="flab" style="margin-top:18px">Flyer A5 · 135 g</div><div class="stepper"><button data-act="qStep" data-d="-50" aria-label="Retirer 50">−</button><div class="v"><b>${S.qVal}</b><span>flyers donnés</span></div><button data-act="qStep" data-d="50" aria-label="Ajouter 50">+</button></div><div class="quick">${[100,200,300,500].map(v=>`<button data-act="qSet" data-v="${v}">${v}</button>`).join('')}</div><button class="btn p" data-act="qOk">Valider le rechargement</button><p class="small" style="text-align:center;margin-top:10px">Léa devra confirmer la quantité. Le chiffre confirmé part dans la colonne « Rechargé » de l’admin.</p>`);}
A.qStep=el=>{S.qVal=Math.max(0,S.qVal+ +el.dataset.d);openReappro();};
A.qSet=el=>{S.qVal=+el.dataset.v;openReappro();};
A.qOk=()=>{S.leaState='pending';closeSheet();rerender();toast(`Rechargement de ${S.qVal} flyers envoyé. Léa doit le confirmer.`);setTimeout(()=>{S.leaState='ok';if(S.cur==='terrain')rerender();toast('Léa a confirmé le rechargement.');},4000);};

/* ================= Check-out ================= */
A.checkoutStart=()=>{if(S.T.paused){toast('Reprends ta mission avant de la terminer.');return;}go('checkout');};
R.checkout=()=>{const T=S.T,m=M[T.id];const tiles=[['selfie','Un selfie','On doit bien voir ton visage']];if(m.svc==='hand')tiles.push(['spot','Le spot de distribution','En fin de mission']);if(m.svc==='store')tiles.push(['shop','Le matériel restant','Affiches et flyers non déposés']);
  const n=T.pts.filter(p=>p.done).length;
  const warn=m.svc==='box'?`<div class="ci-item"><span class="n">1</span><div>Assure-toi d’avoir parcouru tous les points de tes 2 zones.</div></div>`:m.svc==='store'?(n<T.pts.length?`<div class="infocard warn">${ic('info','sm')}<span><b>${n} commerces validés sur ${T.pts.length}.</b> Les commerces non validés seront signalés à l’équipe.</span></div>`:`<div class="infocard good">${ic('check','sm')}<span>Tous les commerces sont validés.</span></div>`):`<div class="ci-item"><span class="n">1</span><div>Assure-toi d’avoir distribué tes flyers sur le spot prévu.</div></div>`;
  return {tabs:false,noBanner:true,html:`<div class="scroll" style="bottom:100px"><div class="hdr"><button class="xbtn js-back" aria-label="Fermer">${ic('x')}</button><div class="ttl"><b>Check-out de mission</b><span>${m.title}</span></div></div>
    <div class="ob-h" style="font-size:21px">Tu es sur le point de terminer ta mission</div><div class="ci-list">${warn}</div>
    ${tiles.map(([k,t,s])=>`<button class="phototile ${T.co[k]?'done':''}" data-act="coPhoto" data-k="${k}"><span class="ph ${k==='shop'?'pack':k}">${T.co[k]?'':ic('cam')}</span><span><span class="t" style="display:block">${t}</span><span class="s">${T.co[k]?'Photo prise':s}</span></span>${T.co[k]?`<span class="ok">${ic('check')}</span>`:''}</button>`).join('')}
    <div class="flab" style="margin-top:20px">Supports restants</div>
    ${m.formats.map((f,i)=>`<div class="numrow"><div><div class="t">${f[0]}</div><div class="s">Départ ${i===0?(T.ci.flyers||f[1]):f[1]}${i===0&&T.recharged?' + '+T.recharged+' rechargés':''}</div></div><input class="inp" inputmode="numeric" id="co${i}" value="${T.co['f'+i]||''}" placeholder="0"></div>`).join('')}
    </div><div class="full-cta"><button class="btn p" data-act="coOk">Valider mon check-out</button></div>`};};
const saveCo=()=>M[S.T.id].formats.forEach((f,i)=>{const e=$('#co'+i);if(e)S.T.co['f'+i]=e.value;});
A.coPhoto=el=>{saveCo();S.T.co[el.dataset.k]=true;show('checkout');toast('Photo enregistrée.');};
A.coOk=()=>{const T=S.T,m=M[T.id];saveCo();const need=['selfie',...(m.svc==='hand'?['spot']:[]),...(m.svc==='store'?['shop']:[])];
  if(need.some(k=>!T.co[k])){toast('Il manque une photo.');return;}
  if(m.formats.some((f,i)=>T.co['f'+i]===''||T.co['f'+i]===undefined)){toast('Indique les supports restants (0 si tout est distribué).');return;}
  const start=+(T.ci.flyers||m.formats[0][1]);const left=+T.co.f0||0;
  S.lastRun={id:m.id,active:activeMs(),pauses:T.pauses.length,dist:(activeMs()/3600000*3.8).toFixed(1).replace('.',','),flyers:Math.max(0,start+T.recharged-left),photos:T.photos+2+(m.svc==='hand'?1:0),an:T.anomalies.length,rm:T.remarks.length,pts:T.pts.filter(p=>p.done).length,ptsN:T.pts.length};
  m.st='terminee';m.recap=null;S.T=null;S.stack=[['home',{}]];
  if(m.svc==='hand'){S.form={id:m.id,q:0,a:{}};show('form',{id:m.id});}else show('done',{id:m.id});};

/* ================= Formulaire de fin (Hand) ================= */
const FORM=[
  {t:'text',q:'Quel est l’identifiant de ta mission ?',h:'Écris directement le nom du groupe WhatsApp correspondant à ta mission.',req:1,ph:'Ex. PILATES-PUTEAUX-07'},
  {t:'number',q:'Combien de supports avais-tu en début de mission ?',h:'Flyers, échantillons ou autres, tels que reçus pour mener à bien ta mission.',req:1,ph:'0'},
  {t:'choice',q:'Les personnes réceptives étaient plutôt…',opts:['Des femmes','Des hommes','Autant les deux'],req:1},
  {t:'scale',q:'Sur 10 passants approchés, combien ont accepté le support ?',req:1},
  {t:'date',q:'Date de ta mission',req:1},
  {t:'photo',q:'Une photo de ton point de distribution',h:'Vue d’ensemble, pour le rapport client.',req:0}
];
R.form=()=>{const F=S.form,q=FORM[F.q],a=F.a[F.q];
  let inp='';
  if(q.t==='text'||q.t==='number')inp=`<input class="inp" id="tfIn" ${q.t==='number'?'inputmode="numeric"':''} placeholder="${q.ph}" value="${a||''}">`;
  if(q.t==='date')inp=`<input class="inp" id="tfIn" type="date" value="${a||'2026-10-07'}">`;
  if(q.t==='choice')inp=`<div class="pick one" style="margin-top:20px">${q.opts.map((o,i)=>`<button class="pk ${a===o?'on':''}" data-act="tfPick" data-v="${o}"><span style="width:26px;height:26px;border-radius:8px;border:1.5px solid var(--m-border-subtle);display:grid;place-items:center;font-size:12px">${'ABC'[i]}</span>${o}<span class="ck"></span></button>`).join('')}</div>`;
  if(q.t==='scale')inp=`<div class="scale">${Array.from({length:10},(_,i)=>`<button class="${a==i+1?'on':''}" data-act="tfPick" data-v="${i+1}">${i+1}</button>`).join('')}</div><div class="scale-l"><span>Aucun</span><span>Tous</span></div>`;
  if(q.t==='photo')inp=`<button class="phototile ${a?'done':''}" data-act="tfPick" data-v="1" style="margin-top:20px"><span class="ph spot">${a?'':ic('cam')}</span><span><span class="t" style="display:block">${a?'Photo ajoutée':'Prendre la photo'}</span><span class="s">Facultatif</span></span></button>`;
  return {tabs:false,html:`<div class="scroll tf" style="bottom:100px;padding-top:10px"><div class="hdr">${F.q?`<button class="ib" data-act="tfPrev" aria-label="Question précédente">${ic('back')}</button>`:'<span style="height:44px"></span>'}<div class="ttl"><b>Formulaire de fin de mission</b><span>${M[F.id].title}</span></div></div>
    <div class="tfbar"><i style="width:${(F.q)/FORM.length*100}%"></i></div>
    <div class="qn">Question ${F.q+1} sur ${FORM.length}${q.req?' · obligatoire':''}</div><h3>${q.q}</h3>${q.h?`<p class="help">${q.h}</p>`:''}${inp}
    <div class="err-msg" id="tfErr">${ic('alert','xs')}Oups ! Tu dois répondre pour continuer.</div></div>
    <div class="full-cta"><button class="btn p" data-act="tfNext">${F.q===FORM.length-1?'Envoyer mes réponses':'Ok'}</button></div>`};};
A.tfPick=el=>{S.form.a[S.form.q]=el.dataset.v;rerender();};
A.tfPrev=()=>{S.form.q--;rerender();};
A.tfNext=()=>{const F=S.form,q=FORM[F.q];const i=$('#tfIn');if(i)F.a[F.q]=i.value.trim();if(q.req&&!F.a[F.q]){$('#tfErr').classList.add('on');return;}if(F.q<FORM.length-1){F.q++;rerender();}else show('done',{id:F.id,form:1});};

/* ================= Mission terminée ================= */
R.done=p=>{const r=S.lastRun||{active:0,pauses:0,dist:'0,0',flyers:0,photos:0,an:0,rm:0};const m=M[p.id];
  return {tabs:false,html:`<div class="scroll" style="bottom:160px"><div class="hero-done"><div class="bigok">${ic('check')}</div><h2>Mission terminée, merci !</h2><p>${p.form?'Merci pour ton temps, tes réponses ont bien été envoyées. ':''}L’équipe va valider ta mission. Tu verras le récap (heures retenues, pauses déduites, bonus) dans Mes missions.</p></div>
    <div class="rec"><div><b>${fmt(r.active).slice(0,5)}</b><span>temps actif</span></div><div><b>${r.pauses}</b><span>pause${r.pauses>1?'s':''} déduite${r.pauses>1?'s':''}</span></div><div><b>${r.dist} km</b><span>parcourus</span></div>
    ${m.svc==='store'?`<div><b>${r.pts} / ${r.ptsN}</b><span>commerces validés</span></div>`:`<div><b>${r.flyers}</b><span>supports distribués</span></div>`}<div><b>${r.photos}</b><span>photos envoyées</span></div><div><b>${m.svc==='hand'?r.rm:r.an}</b><span>${m.svc==='hand'?'remarques':'anomalies'}</span></div></div></div>
    <div class="full-cta"><button class="btn p" data-act="toHome">Retour à l’accueil</button><button class="btn s" data-act="toMissions">Trouver d’autres missions</button></div>`};};
A.toMissions=()=>{S.stack=[];S.filter='dispo';show('missions');};

/* ================= Messages ================= */
const thIcon=t=>t.icon==='camp'?`<span class="ic camp">${ic('hash','sm')}</span>`:t.icon==='chef'?`<span class="ic chef">${ic('crown','sm')}</span>`:t.icon==='ffy'?'<span class="ic ffy">F</span>':`<span class="ic">${ic('archive','sm')}</span>`;
R.inbox=()=>{
  const last=t=>{const m=[...t.msgs].reverse().find(x=>!x.sep);return (m.me?'Toi':m.name+(m.a?' · FFY':''))+' : '+(m.t||'Photo');};
  const row=([k,t])=>`<button class="th ${t.unread?'unread':''} ${t.archived?'arch':''}" data-go="thread" data-id="${k}">${thIcon(t)}<div class="grow">${t.group==='pin'?'<div class="pinlbl">Épinglé · toujours disponible</div>':''}<div class="l1"><span class="t">${t.list}</span><span class="time">${t.time}</span></div><div class="s">${esc(last(t))}</div></div>${t.unread?`<span class="n">${t.unread}</span>`:''}</button>`;
  const E=Object.entries(TH).filter(([k,t])=>!t.chef||S.role==='chef');const g=n=>E.filter(([k,t])=>t.group===n);
  return {tabs:false,html:`<div class="scroll" style="bottom:0"><div class="hdr">${backBtn}<div class="ttl"><b style="font-size:22px">Messages</b></div></div>
    <div class="pinned">${g('pin').map(row).join('')}</div>
    <div class="sec-t">Tes prestations</div><div class="groupcard">${g('p').map(row).join('')}</div>
    <div class="sec-t">Archivées</div><div class="groupcard">${g('a').map(row).join('')}</div>
    <p class="small" style="margin:14px 4px 0">Un chat par prestation à laquelle tu es affecté·e, archivé à la fin de la prestation. Pas de messages privés entre street marketeurs.</p></div>`};
};
R.thread=p=>{const t=TH[p.id];t.unread=0;
  let h=t.info?`<div class="cinfo ${t.archived?'arch':''}">${ic(t.archived?'archive':'info','sm')}<span>${t.info}</span></div>`:'';
  h+='<div class="msgs">'+t.msgs.map(m=>{
    if(m.sep)return `<div class="dsep">${m.sep}</div>`;
    if(m.me)return m.wait?`<div class="m me"><div class="b" style="opacity:.7">${m.t}</div><div class="meta wait">${ic('clock','xs')}En attente de réseau</div></div>`:`<div class="m me"><div class="b">${m.t}</div><div class="meta">${m.time} · ${m.seen}<svg class="i xs" style="color:var(--ffy-success)"><use href="#i-dcheck"/></svg></div></div>`;
    return `<div class="m ${m.a?'admin':''}">${m.a?'<div class="av ffy">F</div>':`<div class="av" style="--c:${m.c}">${m.ini}</div>`}<div><div class="who">${m.name}${m.a?'<span class="role">FFY · Production</span>':''}<span class="muted" style="font-weight:500">${m.time}</span></div><div class="b">${m.photo?`<div class="photo"><span>${m.photo}</span></div>`:''}${m.t}</div></div></div>`;}).join('')+'</div>';
  return {tabs:false,html:`<div class="chathead">${backBtn}<div class="ttl"><b>${t.title}</b><span>${t.sub}</span></div></div>
    <div class="offbar">${ic('info','xs')}Hors connexion · tes messages partiront au retour du réseau</div>
    <div class="chatscroll" id="thBody">${h}</div>
    <form class="composer ${t.archived?'off':''}" id="composer" onsubmit="return sendMsg(event)"><button type="button" class="att" data-act="photoChat" aria-label="Ajouter une photo">${ic('cam')}</button><input id="cInput" placeholder="${t.archived?'Conversation archivée':'Écrire un message'}" autocomplete="off"><button class="send" aria-label="Envoyer">${ic('send','sm')}</button></form>`,
    after:()=>{const b=$('#thBody');b.scrollTop=b.scrollHeight;}};
};
function sendMsg(e){e.preventDefault();const v=$('#cInput').value.trim();if(!v)return false;const t=TH[S.params.id];const d=new Date();
  const msg={me:1,t:esc(v),time:d.getHours()+':'+String(d.getMinutes()).padStart(2,'0'),seen:'Envoyé',wait:!S.online,th:S.params.id};t.msgs.push(msg);rerender();
  if(S.online)setTimeout(()=>{msg.seen=msg.th==='ffy'?'Vu par Thomas':'Vu par 4';if(S.cur==='thread')rerender();},1600);return false;}
A.photoChat=()=>toast('Photo envoyée dans la conversation.');

/* ================= Notifications ================= */
R.notifs=()=>({tabs:false,html:`<div class="scroll" style="bottom:0"><div class="hdr">${backBtn}<div class="ttl"><b style="font-size:22px">Notifications</b></div><button class="lnk" style="font-size:13px" data-act="toast" data-msg="Tout est marqué comme lu.">Tout lire</button></div>
  <div class="sec-t" style="margin-top:6px">Aujourd’hui</div><div class="groupcard">
  <button class="nt new" data-go="detail" data-id="pil" style="--c:var(--ffy-yellow)"><span class="ic">${ic('clock','sm')}</span><span class="grow"><span class="t">Confirme ta présence<span>il y a 20 min</span></span><span class="s" style="display:block">Studio Pilates Rive, demain 8h00. Il te reste 3 h 12 pour répondre.</span></span></button>
  <button class="nt new" data-go="detail" data-id="lumen" style="--c:var(--ffy-yellow)"><span class="ic">${ic('shield','sm')}</span><span class="grow"><span class="t">Backup · Boulangerie Lumen<span>9:40</span></span><span class="s" style="display:block">Tu as été pré-sélectionné·e en backup. Tu as 2 h pour confirmer ta présence.</span></span></button>
  <button class="nt new" data-go="detail" data-id="oree" style="--c:var(--ffy-purple)"><span class="ic">${ic('play','sm')}</span><span class="grow"><span class="t">Lance ta mission<span>9:12</span></span><span class="s" style="display:block">Cabinet Orée commence à 14h00. Quand tu es sur place, lance ta mission.</span></span></button>
  <button class="nt" data-act="mFromNotif" style="--c:var(--ffy-green)"><span class="ic">${ic('plus','sm')}</span><span class="grow"><span class="t">Nouvelle mission près de chez toi<span>8:30</span></span><span class="s" style="display:block">Salle Voltige, La Défense · 42 €.</span></span></button></div>
  <div class="sec-t">Plus tôt</div><div class="groupcard">
  <button class="nt" data-go="invoice" data-id="sep" style="--c:var(--ffy-blue)"><span class="ic">${ic('euro','sm')}</span><span class="grow"><span class="t">Ta facture de septembre est prête<span>lun.</span></span><span class="s" style="display:block">Tu as 48 h pour la valider ou la contester.</span></span></button>
  <button class="nt" data-go="detail" data-id="arlo" data-tab="recap" style="--c:var(--ffy-success)"><span class="ic">${ic('check','sm')}</span><span class="grow"><span class="t">Mission validée<span>dim.</span></span><span class="s" style="display:block">Maison Arlo : 3 h 51 retenues, 53,90 €. Retour de l’équipe disponible.</span></span></button>
  <button class="nt" data-go="detail" data-id="nomade" style="--c:var(--ffy-border)"><span class="ic">${ic('x','sm')}</span><span class="grow"><span class="t">Candidature non retenue<span>dim.</span></span><span class="s" style="display:block">Café Nomade. Voir le message de l’équipe.</span></span></button>
  <button class="nt" data-go="detail" data-id="arlo" style="--c:var(--ffy-danger)"><span class="ic">${ic('alert','sm')}</span><span class="grow"><span class="t">Tu es hors de ta zone<span>sam.</span></span><span class="s" style="display:block">Tu es hors de ta zone de distribution depuis 12 minutes.</span></span></button></div></div>`});
A.mFromNotif=()=>{S.filter='dispo';go('missions');};

/* ================= Compte ================= */
const accRow=(i,t,go,extra='')=>`<button class="trow" ${go}><span class="lead-ic">${ic(i,'sm')}</span><span class="grow">${t}</span>${extra}${ic('down','sm chev')}</button>`;
R.account=()=>({tabs:true,html:`<div class="scroll"><div class="ah"><h4>Compte</h4></div>
  <div class="card" style="display:flex;gap:14px;align-items:center"><div class="av2" style="--c:#3f8f6b;width:58px;height:58px;font-size:19px">IN</div><div style="flex:1"><b style="font-size:17px">Inès N.</b><div class="muted" style="font-size:13px;margin-top:2px">ines.n@exemple.fr</div><div style="margin-top:6px">${S.acct==='valide'?pill('Compte validé','--ffy-success',1):pill('RDV à faire','--ffy-yellow',1)}</div></div></div>
  <div class="sec-t">Facturation</div><div class="groupcard">${accRow('euro','Factures','data-go="invoices"',INV.sep.st==='envoyee'?'<span class="n" style="min-width:20px;height:20px;border-radius:10px;background:var(--ffy-danger);color:#fff;font-size:12px;font-weight:700;display:grid;place-items:center">1</span>':'')}${accRow('bag','Auto-entreprise et IBAN','data-go="acc-ae"')}</div>
  <div class="sec-t">Mon profil</div><div class="groupcard">
    ${accRow('user','Informations personnelles','data-go="acc-perso"')}${accRow('lock','Informations de connexion','data-go="acc-login"')}${accRow('walk','Mobilité et préférences','data-go="acc-pref"')}${accRow('cal','Disponibilités','data-go="acc-dispo"')}</div>
  <div class="sec-t">Application</div><div class="groupcard">
    <button class="trow" data-act="notifT"><span class="lead-ic">${ic('bell','sm')}</span><span class="grow">Notifications push<div class="s">Missions, rappels de présence, messages</div></span><span class="tgl ${S.notif?'on':''}"></span></button>
    ${accRow('bell','Centre de notifications','data-go="notifs"')}${accRow('chat','Contact','data-go="thread" data-id="ffy"')}${accRow('star','Noter l’application','data-act="toast" data-msg="Ouverture de l’App Store."')}${accRow('cam2','Suis-nous sur Instagram','data-act="toast" data-msg="Ouverture d’Instagram."')}${accRow('scale','Conditions générales','data-act="charte"')}</div>
  <div class="groupcard" style="margin-top:14px"><button class="trow" data-act="logout"><span class="lead-ic">${ic('logout','sm')}</span><span class="grow">Se déconnecter</span></button><button class="trow" data-act="delAcc" style="color:var(--ffy-danger)"><span class="lead-ic" style="color:var(--ffy-danger)">${ic('trash','sm')}</span><span class="grow">Supprimer mon compte</span></button></div>
  <p class="small" style="text-align:center;margin-top:14px">Version 2.0.0</p></div>`});
A.notifT=el=>{S.notif=!S.notif;el.querySelector('.tgl').classList.toggle('on',S.notif);};
A.logout=()=>openSheet(`<div class="h3">Se déconnecter ?</div><p class="lead">Tu devras saisir à nouveau ton e-mail et ton mot de passe.</p><button class="btn p" data-act="logoutOk">Se déconnecter</button><button class="btn s" data-act="closeSheet">Annuler</button>`);
A.logoutOk=()=>{closeSheet();reset('landing');};
A.delAcc=()=>openSheet(`<div class="h3">Supprimer ton compte ?</div><p class="lead">Ton compte sera désactivé et tes informations personnelles supprimées sous 24 à 48 h. Tes factures restent conservées, c’est une obligation légale.</p><button class="btn p" style="background:var(--ffy-danger);color:#fff" data-act="delOk">Supprimer mon compte</button><button class="btn s" data-act="closeSheet">Annuler</button>`);
A.delOk=()=>{closeSheet();reset('landing');toast('Demande de suppression enregistrée.');};
const subPage=(title,intro,body,cta='Enregistrer')=>({tabs:false,html:`<div class="scroll" style="bottom:100px"><div class="hdr">${backBtn}<div class="ttl"><b>${title}</b></div></div>${intro?`<p class="ob-p" style="margin-top:0">${intro}</p>`:''}${body}</div><div class="full-cta"><button class="btn p" data-act="saved">${cta}</button></div>`});
A.saved=()=>{back();toast('Modifications enregistrées.');};
R['acc-perso']=()=>subPage('Informations personnelles','Tes informations de contact et ta photo de profil.',`<button class="avatar-up has" data-act="toast" data-msg="Photo mise à jour.">IN<span class="plus">${ic('edit','sm')}</span></button>
  <label class="field"><span class="flab">Prénom</span><input class="inp" value="Inès"></label><label class="field"><span class="flab">Nom</span><input class="inp" value="N."></label><label class="field"><span class="flab">Date de naissance</span><input class="inp" type="date" value="2001-04-25"></label>
  <label class="field"><span class="flab">Téléphone</span><input class="inp" value="06 12 34 56 78"></label><label class="field"><span class="flab">Adresse</span><input class="inp" value="8 rue des Lilas, 92400 Courbevoie"></label>
  <label class="field"><span class="flab">Présentation</span><textarea class="inp" placeholder="Quelques mots sur toi et tes expériences">Étudiante, 2 ans d’expérience en distribution et en événementiel.</textarea></label>`);
R['acc-login']=()=>subPage('Informations de connexion','',`<label class="field"><span class="flab">E-mail</span><input class="inp" value="ines.n@exemple.fr"></label><label class="field"><span class="flab">Mot de passe actuel</span><div class="pwd"><input class="inp" type="password" value="motdepasse1"><button data-act="pwdToggle">Afficher</button></div></label><label class="field"><span class="flab">Nouveau mot de passe</span><div class="pwd"><input class="inp" type="password" placeholder="8 caractères minimum"><button data-act="pwdToggle">Afficher</button></div></label>`);
R['acc-ae']=()=>subPage('Auto-entreprise et IBAN','Ces informations servent à générer tes factures et à te payer.',aeBlock());
R['acc-pref']=()=>subPage('Mobilité et préférences','On te notifie en priorité pour les missions qui te correspondent.',prefBlock());
R['acc-dispo']=()=>subPage('Disponibilités','On te notifie en priorité sur les créneaux où tu es disponible.',dispoBlock());

/* ================= Factures ================= */

/* ================= Réglages de démo ================= */
function syncPanel(){$$('#roleSeg button').forEach(b=>b.classList.toggle('on',b.dataset.role===S.role));$$('#acctSeg button').forEach(b=>b.classList.toggle('on',b.dataset.acct===S.acct));}
$('#roleSeg').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;S.role=b.dataset.role;syncPanel();if(S.T&&S.role==='sm')S.T.team=false;rerender();toast(S.role==='chef'?'Rôle chef d’équipe : « Mon équipe » en mode terrain et chat des chefs.':'Rôle street marketeur.');});
$('#acctSeg').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;S.acct=b.dataset.acct;syncPanel();rerender();});
$('#themeSeg')&&$('#themeSeg').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;document.documentElement.dataset.theme=b.dataset.t;$$('#themeSeg button').forEach(x=>x.classList.toggle('on',x===b));});
$('#netSeg').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;S.online=b.dataset.net==='1';$$('#netSeg button').forEach(x=>x.classList.toggle('on',x===b));phone.classList.toggle('offline',!S.online);
  if(S.online){let n=0;Object.values(TH).forEach(t=>t.msgs.forEach(m=>{if(m.wait){m.wait=false;n++;setTimeout(()=>{m.seen=m.th==='ffy'?'Vu par Thomas':'Vu par 4';if(S.cur==='thread')rerender();},1600);}}));if(S.cur==='thread')rerender();toast(n?`Réseau retrouvé : ${n} message${n>1?'s':''} envoyé${n>1?'s':''}.`:'Réseau retrouvé.');}
  else toast('Hors connexion : les messages reçus restent lisibles.');});
document.querySelector('.panel').addEventListener('click',e=>{const b=e.target.closest('[data-jump]');if(!b)return;const j=b.dataset.jump,id=b.dataset.id;S.stack=[];
  if(j==='missions'){S.view='mine';S.ms=b.dataset.s||'avenir';show('missions');return;}
  if(j==='camps'){S.view='dispo';S.cf='all';show('missions');return;}
  if(j==='launch'){const m=M[id];if(S.T&&S.T.id===id&&S.T.phase==='run'){S.stack=[['home',{}]];show('terrain');return;}if(S.T&&S.T.phase==='run'&&S.T.id!==id){M[S.T.id].st='lancement';}if(['terminee','refusee'].includes(m.st)){}m.st='lancement';if(id!=='pil')m.brief=true;S.T=newT(id);S.stack=[['home',{}]];show('terrain');return;}
  if(j==='chef'){S.role='chef';syncPanel();const m=M.oree;m.st='encours';m.brief=true;if(!S.T||S.T.id!=='oree'||S.T.phase!=='run'){S.T=newT('oree');S.T.phase='run';S.T.start=Date.now()-(47*60000);S.T.ci.flyers=1500;}S.T.team=true;S.T.vb=zonesVB();S.stack=[['home',{}]];show('terrain');return;}
  if(j==='onboard'){S.acct='rdv';syncPanel();show('home');return;}
  if(['home','account'].includes(j)){show(j);return;}
  S.stack=[['home',{}]];show(j,{id});});

/* ================= Chrono ================= */
function tick(){const T=S.T;if(!T||T.phase!=='run')return;const a=activeMs();
  const set=(id,v)=>{const e=document.getElementById(id);if(e)e.textContent=v;};
  set('cTime',fmt(a));set('bTime',fmt(a));set('hTime',fmt(a));set('sActive',fmt(a).slice(0,5));
  set('sDist',T.gps?(a/3600000*3.8).toFixed(1).replace('.',',')+' km':'Coupé');
  if(T.paused)set('pauseFor',fmt(Date.now()-T.pauseStart).slice(3));
  set('miniS',`Actif ${fmt(a).slice(0,5)} · ${T.gps?(a/3600000*3.8).toFixed(1).replace('.',',')+' km':'GPS coupé'} · ${T.pauses.length} pause${T.pauses.length>1?'s':''}${T.photos?' · '+T.photos+' photo'+(T.photos>1?'s':''):''}`);
  $('#mbanner').classList.toggle('paused',T.paused);set('bLabel',T.paused?'Mission en pause':'Mission en cours');}
setInterval(tick,1000);

S.ob.stage=S.ob.stage||0; // 0 groupé à réserver · 1 groupé réservé · 2 individuel à réserver · 3 individuel réservé · 4 validé
S.ob.slots={};
function obTracker(){const st=S.ob.stage,sl=S.ob.slots;
  const step=(n,state,t,s,extra='')=>`<div class="step4 ${state}"><span class="n">${state==='done'?ic('check','sm'):n}</span><div style="flex:1;min-width:0"><div class="t">${t}</div><div class="s">${s}</div>${extra}</div></div>`;

  return `<div class="steps4">
    ${step(1,'done','Inscription dans l’app','Terminée')}
    ${st===0?step(2,'cur','Réserve ton rendez-vous groupé','30 min en visio avec un chef de projet FFY, pour tout t’expliquer.',`<button class="btn p sm" style="width:100%;margin-top:10px" data-act="calendly" data-type="groupe">Choisir un créneau</button>`)
      :st===1?step(2,'cur','Rendez-vous groupé réservé','Le lien de la visio t’a été envoyé par e-mail.',booked(sl.groupe,'Visio · 30 min','groupe')+`<button class="linkbtn demo" data-act="obStage" data-s="2">Démo : le rendez-vous groupé a eu lieu</button>`)
      :step(2,'done','Rendez-vous groupé','Fait le mercredi 7 oct.')}
    ${st<2?step(3,'','Appel individuel','Tu pourras le réserver après le rendez-vous groupé.')
      :st===2?step(3,'cur','Réserve ton appel individuel','15 min au téléphone avec un chef de projet pour faire connaissance.',`<button class="btn p sm" style="width:100%;margin-top:10px" data-act="calendly" data-type="indiv">Choisir un créneau</button>`)
      :st===3?step(3,'cur','Appel individuel réservé','On t’appelle sur le 06 12 34 56 78.',booked(sl.indiv,'Téléphone · 15 min','indiv')+`<button class="linkbtn demo" data-act="obStage" data-s="4">Démo : l’équipe valide ton compte</button>`)
      :step(3,'done','Appel individuel','Fait')}
    ${step(4,st===4?'cur':'','Postule à tes premières missions',st===4?'Ton compte est validé, bienvenue dans l’équipe !':'Accessible dès que l’équipe a validé ton compte.')}
  </div>`;}

/* Calendly en webview */
A.calendly=el=>go('calendly',{type:el.dataset.type||'groupe',step:'day'});
const CAL={groupe:{t:'Rendez-vous groupé FFY',d:'30 min',how:'Visio (Google Meet)',days:[7,9,12,14,16],times:['10:00','14:00','18:00']},indiv:{t:'Appel individuel FFY',d:'15 min',how:'Appel téléphonique',days:[8,9,13,15],times:['09:30','11:00','16:30','17:15']}};
R.calendly=p=>{const c=CAL[p.type];const day=p.day,time=p.time;const wd=d=>WDL[new Date(2026,9,d).getDay()];
  let inner='';
  if(p.step==='day'){const first=(new Date(2026,9,1).getDay()+6)%7;
    inner=`<div class="cal-h">Choisissez un jour</div><div class="cal-m"><button class="cal-nav" data-act="toast" data-msg="Aucun créneau en septembre.">‹</button><b>octobre 2026</b><button class="cal-nav" data-act="toast" data-msg="Les créneaux de novembre ne sont pas encore ouverts.">›</button></div>
    <div class="cal-g">${['lun.','mar.','mer.','jeu.','ven.','sam.','dim.'].map(x=>`<span class="w">${x}</span>`).join('')}${Array.from({length:first},()=>'<span></span>').join('')}${Array.from({length:31},(_,i)=>{const d=i+1;const on=c.days.includes(d);return on?`<button class="cal-d on" data-act="calDay" data-d="${d}">${d}</button>`:`<span class="cal-d ${d===6?'today':''}">${d}</span>`;}).join('')}</div>
    <div class="cal-tz">${ic('dot','xs')}Heure d’Europe centrale</div>`;}
  if(p.step==='time')inner=`<div class="cal-h">${wd(day)} ${day} octobre</div><p class="cal-sub">Choisissez une heure</p><div class="cal-times">${c.times.map(t=>`<button class="cal-t" data-act="calTime" data-t="${t}">${t.replace(':','h')}</button>`).join('')}</div>`;
  if(p.step==='form')inner=`<div class="cal-h">Saisissez les détails</div><p class="cal-sub">${wd(day)} ${day} octobre · ${time.replace(':','h')} · ${c.d}</p><label class="cal-f"><span>Nom *</span><input value="Inès N."></label><label class="cal-f"><span>E-mail *</span><input value="ines.n@exemple.fr"></label>${p.type==='indiv'?'<label class="cal-f"><span>Téléphone *</span><input value="06 12 34 56 78"></label>':''}<button class="cal-btn" data-act="calBook">Planifier l’événement</button>`;
  if(p.step==='ok')inner=`<div class="cal-ok">${ic('check')}</div><div class="cal-h">Vous êtes programmé·e</div><p class="cal-sub">Une invitation a été envoyée à votre adresse e-mail.</p><div class="cal-sum"><b>${c.t}</b><span>${ic('cal','xs')}${time.replace(':','h')}, ${wd(day)} ${day} octobre 2026</span><span>${ic('dot','xs')}${c.how}</span></div>`;

    <div class="webview"><div class="cal-ev"><span>FlyingForYou</span><b>${c.t}</b><em>${ic('clock','xs')}${c.d} · ${c.how}</em></div>${inner}<div class="cal-foot">Propulsé par Calendly · Paramètres des cookies</div></div>

/* ================= v6 : Détail mission unifié ================= */
R.detail=p=>{
  const m=M[p.id];const run=S.T&&S.T.id===m.id&&S.T.phase==='run';const off=isOffer(m);const i=dayInfo(m.day);
  const chatId=m.id==='pil'?'pilc':'camp';
  let st='';
  if(m.st==='confirm')st=`<div class="countdown">${ic('clock')}<div><b>${m.left}</b><div class="small">pour confirmer ta présence, sinon le créneau est libéré</div></div></div>`;
  if(m.backup)st+=`<div class="infocard warn">${ic('shield','sm')}<span>${off?`Mission en <b>backup</b> : tu restes disponible au cas où un titulaire se désiste. Bonus de ${m.bonus} € si tu es appelé·e.`:`Tu as été <b>pré-sélectionné·e en backup</b>. Confirme ta présence pour garder ta place.`}</span></div>`;
  if(m.st==='refusee')st+=`<div class="infocard bad">${ic('info','sm')}<span><b>Candidature non retenue.</b><br>${m.refus}</span></div>`;
  if(m.st==='candidature')st+=`<div class="infocard">${ic('clock','sm')}<span>Ta candidature est en cours d’examen. Tu recevras une notification dès que l’équipe aura répondu.</span></div>`;
  if(m.st==='valide')st+=`<div class="infocard good">${ic('check','sm')}<span>Tu es retenu·e ! La confirmation de présence s’ouvrira la veille de la mission.</span></div>`;
  let recap='';
  if(m.st==='terminee'){const r=m.recap;recap=r?`<div class="dsec"><div class="dsec-h">Récap validé</div><div class="infocard good" style="margin-top:0">${ic('check','sm')}<span><b>Mission validée par l’équipe.</b> Elle apparaîtra sur ta facture d’octobre.</span></div>
      <div class="rec"><div><b>${r.ci} → ${r.co}</b><span>check-in → check-out</span></div><div><b>${r.paid}</b><span>temps retenu</span></div><div><b>${r.pauses.split(' · ')[1]}</b><span>${r.pauses.split(' · ')[0]} déduite</span></div><div><b>${r.amount}</b><span>montant validé</span></div><div><b>${r.dist}</b><span>parcourus</span></div><div><b>${r.flyers}</b><span>flyers distribués</span></div></div>
      <div class="card" style="margin-top:8px"><div class="stars">${Array.from({length:5},(_,k)=>`<svg class="i" style="opacity:${k<r.note?1:.25}"><use href="#i-star"/></svg>`).join('')}</div><p class="brief" style="margin-top:8px">${r.comment}</p><p class="small" style="margin-top:6px">Thomas · équipe Production</p></div></div>`
    :`<div class="dsec"><div class="dsec-h">Récap</div><div class="infocard" style="margin-top:0">${ic('clock','sm')}<span>Mission <b>en cours de validation</b>. Tu verras ici les heures retenues, les pauses déduites, ton bonus et le retour de l’équipe.</span></div></div>`;}
  const where=`<div class="dsec"><div class="dsec-h">Où et quand</div><div class="card" style="padding:0;overflow:hidden"><div class="mapsm" style="margin:0;border-radius:0;height:150px">${staticMap(m,150)}<span class="lbl">Aperçu statique</span></div>
    <div style="padding:12px 16px 14px"><div class="route2" style="margin-top:0"><span class="dot"></span><span><b>Chez toi</b><br><span class="muted">8 rue des Lilas, Courbevoie</span></span><span class="ln"></span><span class="muted">${CAMPS[m.camp].dist}</span><span class="dot end"></span><span><b>${m.svc==='hand'?'Spot · '+(m.spot?m.spot.name:m.zone):m.svc==='store'?'Premier commerce':'Point de départ'}</b><br><span class="muted">${m.addr}</span></span></div>
    <div class="info" style="margin-top:8px"><div class="r"><span>Arrivée conseillée</span><span>${(()=>{const t=toMin(m.h1)-10;return String(t/60|0).padStart(2,'0')+'h'+String(t%60).padStart(2,'0');})()}</span></div></div>
    <button class="btn s sm" style="width:100%;margin-top:8px" data-act="toast" data-msg="Ouverture de l’itinéraire dans Google Maps.">${ic('route','sm')}Voir le trajet</button></div></div></div>`;
  const mission=`<div class="dsec"><div class="dsec-h">Ta mission</div><div class="card"><p class="brief">${m.desc}</p><div class="info" style="margin-top:6px">
    <div class="r"><span>Ton rôle</span><span>${S.role==='chef'&&m.chefable?'Chef d’équipe':'Distributeur'}</span></div>
    <div class="r"><span>Mobilité</span><span>${m.mob}</span></div>
    ${m.formats.length?`<div class="r"><span>Supports</span><span>${m.formats.map(f=>f[0]+' · '+f[1]+' ex.').join('<br>')}</span></div>`:''}
    ${m.qr?`<div class="r"><span>Suivi</span><span>QR code ou code promo</span></div>`:''}</div>
    ${m.cons.length?`<div class="cons">${m.cons.map(c=>`<span>${ic('check','xs')}${c}</span>`).join('')}</div>`:''}</div></div>`;
  const canBrief=!off&&!['candidature','refusee'].includes(m.st);
  const brief=`<div class="dsec"><div class="dsec-h">Brief et échanges</div><div class="card" style="padding:2px 16px">${canBrief?`<button class="brow" data-go="brief" data-id="${m.id}"><span class="trow-ic">${ic('file','sm')}</span><span class="grow"><span class="t" style="display:block">Brief ${SVC[m.svc].n}</span><span class="s">${m.brief?'Lu':'À lire avant de lancer la mission'}</span></span>${m.brief?`<span style="color:var(--ffy-success)">${ic('check','sm')}</span>`:pill('À lire','--ffy-yellow',1)}</button>`:`<div class="brow"><span class="trow-ic">${ic('lock','sm')}</span><span class="grow"><span class="t" style="display:block">Brief ${SVC[m.svc].n}</span><span class="s">Accessible une fois ta candidature validée</span></span></div>`}
    ${!off&&['valide','confirm','lancement','encours'].includes(m.st)?`<button class="brow" data-go="thread" data-id="${chatId}"><span class="trow-ic">${ic('hash','sm')}</span><span class="grow"><span class="t" style="display:block">Chat de la prestation</span><span class="s">SM de la prestation · équipe Production</span></span>${ic('down','sm chev')}</button>`:''}</div></div>`;
  let cta='';
  if(off)cta=`<div class="cta-sum"><b>${pay(m)} €</b><span>${m.places} place${m.places>1?'s':''}</span></div><button class="btn g" data-act="${m.backup?'applyBackup':'apply'}" data-id="${m.id}">${m.backup?'Postuler en backup':'Postuler'}</button>`;
  else if(m.st==='candidature')cta=`<button class="btn s" data-act="withdraw" data-id="${m.id}">Retirer ma candidature</button>`;
  else if(m.st==='confirm')cta=`<button class="btn p" data-act="confirmPres" data-id="${m.id}">Je confirme ma présence</button>`;
  else if(m.st==='lancement')cta=run?`<button class="btn g" data-act="toTerrain">Revenir au mode terrain</button>`:`<button class="btn p" data-act="launch" data-id="${m.id}">Lancer la mission</button>`;
  else if(m.st==='encours')cta=`<button class="btn g" data-act="toTerrain">Revenir au mode terrain</button>`;
  else if(m.st==='terminee'&&m.recap)cta=`<button class="btn s" data-go="invoices">Voir mes factures</button>`;
  const status=off?`<span class="tag-offer">${ic('plus','xs')}${m.backup?'Backup':'Disponible'}</span>`:(run?pill(S.T.paused?'En pause':'En cours',S.T.paused?'--ffy-yellow':'--ffy-success',1):stPill(m,1));
  return {tabs:false,html:`<div class="scroll" style="bottom:${cta?100:0}px;padding-top:0">
    <div class="dhead ${off?'offer':''}" style="--c:${SVC[m.svc].c}">
      <div class="dh-top"><button class="ib js-back" aria-label="Retour">${ic('back')}</button><div class="dh-chips">${svcChip(m.svc)}${status}${tagsFor(m)}${m.qr?`<span class="tagx qr">${ic('qr','xs')}QR</span>`:''}</div></div>
      <h2>${m.title}</h2><div class="dh-sub">${CAMPS[m.camp].place} · ${CAMPS[m.camp].dist} de chez toi</div>
      <div class="facts3"><div><span>${dayLabel(m.day)}</span><b>${i.s} ${i.n} ${i.m}</b></div><div><span>Horaires</span><b>${m.h1.replace(':','h')} à ${m.h2.replace(':','h')}</b></div><div><span>${off?'Tu gagnes':'Rémunération'}</span><b>${pay(m)} €</b><em>${m.rate} €/h × ${m.hours} h</em></div></div>
    </div>
    ${st}${recap}${where}${mission}${brief}</div>${cta?`<div class="sticky ${off?'sticky-offer':''}">${cta}</div>`:''}`};
};

function ticketHero(a){
  if(!a)return `<div class="ticket"><div class="tk-main"><div class="tk-k">Rien de prévu pour l’instant</div><div class="tk-t">Trouve ta prochaine mission</div><button class="btn g" style="margin-top:14px" data-tab="missions">Voir les missions</button></div></div>`;
  if(a.k==='run'){const m=M[S.T.id];return `<div class="ticket run"><div class="tk-main"><div class="tk-k"><span class="pulse" style="background:var(--brand)"></span>Mission en cours</div><div class="tk-t">${m.title}</div><div class="tk-m">${S.T.paused?'En pause':'Chrono'} · <span id="hTime">${fmt(activeMs())}</span></div><button class="btn g" style="margin-top:14px" data-act="toTerrain">Revenir au mode terrain</button></div></div>`;}
  if(a.k==='inv')return `<div class="ticket"><div class="tk-main"><div class="tk-k">Ta prochaine action</div><div class="tk-t">Valide ta facture de septembre</div><div class="tk-m">386,40 € · avant jeudi 18h00</div><button class="btn g" style="margin-top:14px" data-go="invoice" data-id="sep">Voir ma facture</button></div></div>`;
  const m=a.m;const i=dayInfo(m.day);
  const k={confirm:'Confirme ta présence',launch:'Lance ta mission',brief:'Lis ton brief'}[a.k];
  const cta={confirm:`<button class="btn g" data-act="confirmPres" data-id="${m.id}">Je confirme ma présence</button>`,launch:`<button class="btn g" data-act="launch" data-id="${m.id}">Lancer la mission</button>`,brief:`<button class="btn g" data-go="brief" data-id="${m.id}">Lire le brief</button>`}[a.k];
  const chip=a.k==='confirm'?`<span class="tk-chip">${ic('clock','xs')}encore ${m.left}</span>`:a.k==='launch'?`<span class="tk-chip">${ic('clock','xs')}dans 12 min</span>`:'';
  return `<div class="ticket"><div class="tk-main"><div class="tk-k">${m.backup?'Backup · ':''}${k}${chip}</div><div class="tk-t">${m.title}</div><div class="tk-m">${svcChip(m.svc)} ${CAMPS[m.camp].place} · ${m.addr}</div>${cta}<button class="tk-link" data-go="detail" data-id="${m.id}">Voir la mission ${ic('down','xs chev')}</button></div>
    <div class="tk-stub"><span>${i.s}</span><b>${i.n}</b><span>${i.m}</span><em>${m.h1.replace(':','h')}</em></div></div>`;
}
